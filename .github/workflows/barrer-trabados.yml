# Barrer los casos que se quedaron en `procesando`.
#
# ── Por qué existe ────────────────────────────────────────────────────────────
#
# El webhook de WhatsApp contesta rápido y deja el trabajo pesado —extraer y
# contestarle al asegurado— adentro de un `after()` de Vercel. Cuando esa
# instancia se evapora antes de terminar, el caso queda en `procesando` para
# siempre: nadie extrajo nada y nadie contestó. El repo ya lo tenía identificado;
# lo dice el encabezado de `src/app/api/cron/reap-stuck/route.ts`.
#
# Pasó de verdad el 2026-09-02 en producción: el mismo commit, con la función
# fría, tardó más de 150 s y no extrajo ni un campo; diez minutos después, en
# caliente, tardó 13 s y extrajo 18.
#
# El barredor que arregla eso existe y funciona, pero hasta ahora sólo lo
# llamaban `/api/intake/simulate` y `/api/admin/batch-simulate` —o sea, cuando un
# admin corría una simulación— y un cron de Vercel una vez por día. Un siniestro
# real que caía en ese hueco esperaba **hasta 24 horas** a que alguien lo mirara.
#
# ── Por qué acá y no en Vercel ────────────────────────────────────────────────
#
# `vercel.json` ya tiene dos crons y los dos son diarios: ése es el techo del
# plan Hobby —dos tareas, una vez por día— y no vamos a plan pago. GitHub
# Actions corre programado sin plan pago —el repo es privado desde el
# 2026-09-26, así que gasta del cupo gratuito de minutos—, y el barrido vive
# acá. No es un rodeo: es el único lugar sin costo donde esto puede correr
# seguido.
#
# El cron de Vercel se deja igual. Éste puede no correr —GitHub demora las
# tareas programadas cuando está cargado, y lo dice— y entonces el diario sigue
# siendo la red abajo de la red.
#
# ── Lo que NO es ──────────────────────────────────────────────────────────────
#
# No es «mantener la función caliente». En Vercel cada ruta es su propia
# función, así que pegarle a ésta no calienta el webhook de WhatsApp ni el
# worker. Calentar el webhook pediría firmar un payload como Meta cada quince
# minutos, que es fabricar tráfico falso contra el camino de producción. Esto
# ataca la consecuencia —el caso trabado— y no la causa, a propósito.

# -- Y de paso, la salud ------------------------------------------------------
#
# El mismo cron sirve para la otra cosa que nadie miraba. `/api/health` solo se
# consultaba despues de un deploy, desde `pnpm smoke` y el pen test; entre dos
# deploys, nadie. Y lo que ese endpoint ve se rompe SOLO: el token de WhatsApp
# vence, el aviso de push de Gmail se cae al reconectar la casilla, el
# presupuesto de IA se acaba.
#
# Va como paso del mismo job, antes del barrido: un runner menos por corrida, y
# el paso en rojo dice cuál de las dos cosas falló. Corre primero para que un
# barrido colgado no se la lleve puesta.

name: Programado · Barrer trabados en DEV, QA y PRD
run-name: >-
  ${{ github.event.schedule == '23 */2 * * *' && 'PRD · barrido programado'
  || github.event.schedule == '53 */2 * * *' && 'QA · barrido programado'
  || github.event_name == 'schedule' && 'DEV · barrido programado'
  || endsWith(github.event.inputs.url, '-qa.vercel.app') && 'QA · barrido a mano'
  || 'DEV · barrido a mano' }}

on:
  schedule:
    # El barredor escala lo que lleva más de veinte minutos en `procesando` o en
    # `recibido` —el segundo es donde entran las denuncias de verdad, y hasta el
    # 2026-09-08 el barredor no lo miraba: corría, decía `reaped: 0` y quedaba
    # en verde mientras un caso real de hacía más de un día seguía sin
    # contestar—.
    #
    # ── Este cron NO corre cada quince minutos, y decía que sí ────────────────
    #
    # Pedía `*/15`, o sea 96 corridas por día. Medido el 2026-09-08 en este
    # repositorio: disparó SIETE, con huecos de 5h02m (01:27 → 06:29) y 5h13m
    # (06:29 → 11:42). GitHub no garantiza los cron programados y los demora o
    # los saltea bajo carga, más todavía en repositorios públicos. El comentario
    # que había acá prometía «un caso trabado se ve en menos de media hora», y
    # eso no era cierto ningún día.
    #
    # Se deja `*/15` igual —pedir más seguido no cuesta nada y GitHub da lo que
    # puede— pero la garantía NO es este cron: es que el barrido corre también
    # cuando entra un WhatsApp (`api/webhooks/whatsapp`), que es tráfico real y
    # ocurre justo cuando hay algo que barrer. Este workflow es el respaldo para
    # las horas sin tráfico.
    - cron: "*/15 * * * *"
    # Prd, la de los clientes, va aparte y más espaciada: el barrido lo dispara
    # también el tráfico real, y esto es sólo el respaldo. El job `prd` de
    # abajo sólo corre con este cron y sólo si existe `vars.PRD_URL`.
    - cron: "23 */2 * * *"
    # QA también, cada dos horas como prd: recibe las denuncias del cliente de
    # prueba de QA, y un caso trabado ahí esperaba al barrido a mano. Va por el
    # job `barrer`, que elige el secreto por la URL: QA_CRON_SECRET, el mismo del
    # disparo a mano contra QA. Otro minuto, para que no largue junto con prd.
    - cron: "53 */2 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "A qué deploy pegarle"
        required: false
        default: "https://claimmix-dev.vercel.app"

# Si una corrida se demoró y ya viene la siguiente, con una alcanza. Prd y QA
# tienen su propia cola: otra base, otro ritmo, y no se pisan.
concurrency:
  group: ${{ github.event.schedule == '23 */2 * * *' && 'barrer-trabados-prd' || (github.event.schedule == '53 */2 * * *' || endsWith(github.event.inputs.url, '-qa.vercel.app')) && 'barrer-trabados-qa' || 'barrer-trabados' }}
  cancel-in-progress: false

jobs:
  barrer:
    name: ${{ (github.event.schedule == '53 */2 * * *' || endsWith(github.event.inputs.url, '-qa.vercel.app')) && 'QA' || 'DEV' }} · Barrer trabados y mirar la salud
    if: github.event.schedule != '23 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    env:
      # Dev, salvo el cron de QA y el disparo a mano con otra URL. Un solo lugar:
      # el host, la salud, el barrido y la elección del secreto la leen de acá.
      URL: ${{ github.event.inputs.url || (github.event.schedule == '53 */2 * * *' && 'https://claimmix-qa.vercel.app' || 'https://claimmix-dev.vercel.app') }}
    steps:
      # La lista de hosts de ClaimMix vive en el repositorio.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El `if:` de más abajo y la elección del secreto miran el SUFIJO de la
      # URL (`endsWith(..., '-qa.vercel.app')`), no si el host es de verdad uno
      # de los nuestros. Este paso es lo que hace que el `CRON_SECRET` sólo
      # viaje a uno de los dos alias: una vista previa no entra, porque su
      # `CRON_SECRET` no es el de producción.
      - name: ¿A dónde apunta esto?
        id: host
        run: |
          set -u
          case "$URL" in
            https://*) ;;
            *) echo "::error::La URL tiene que empezar con https://"; exit 1 ;;
          esac
          HOST="${URL#https://}"
          case "$HOST" in
            *[/?#@:]*) echo "::error::La URL no puede llevar ruta, puerto, credenciales ni fragmento: ${HOST}"; exit 1 ;;
          esac
          node scripts/lib/hosts-vetados.mjs --conocido "$URL" ||
            { echo "::error::Host fuera de la lista: ${HOST}"; exit 1; }
          # El CRON_SECRET de este job es el de dev o el de QA: prd tiene el suyo y su
          # propio job, acá abajo.
          case "$HOST" in
            claimmix-dev.vercel.app|claimmix-qa.vercel.app) ;;
            *) echo "::error::Este disparo sólo admite dev o QA, no ${HOST}"; exit 1 ;;
          esac

      # Sin `pnpm install`: el guion usa solo `fetch` y modulos nativos, como
      # `comparar-ensayos.mjs`. Instalar dependencias noventa y seis veces por
      # dia para pegarle a una URL seria el gasto mas tonto del repositorio.
      - name: Preguntarle al deploy que alcanza a ver
        id: salud
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        env:
          # El dispatch y el cron de QA apuntan a QA, y el secreto de producción no
          # abre esa puerta: cada proyecto de Vercel tiene el suyo y
          # `/api/cron/reap-stuck` compara contra el del deploy al que se le
          # pega. Barrer QA con el de producción devuelve 401 tres veces.
          # El respaldo `'__falta__'` está por lo mismo que en el barrido de abajo.
          CRON_SECRET: ${{ endsWith(env.URL, '-qa.vercel.app') && (secrets.QA_CRON_SECRET || '__falta__') || (secrets.CRON_SECRET || '__falta__') }}
        run: |
          [ "${CRON_SECRET}" != '__falta__' ] || { echo '::error::Falta el CRON_SECRET de este host (QA_CRON_SECRET para claimmix-qa, CRON_SECRET para claimmix-dev).'; exit 1; }
          node scripts/mirar-salud.mjs

      - name: Pedirle al barredor que pase
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        env:
          # El dispatch y el cron de QA apuntan a QA, y el secreto de producción no
          # abre esa puerta: cada proyecto de Vercel tiene el suyo y
          # `/api/cron/reap-stuck` compara contra el del deploy al que se le
          # pega. Barrer QA con el de producción devuelve 401 tres veces.
          #
          # `a && x || y` cae a `y` cuando `x` está vacío: con QA_CRON_SECRET
          # sin cargar, el de producción viajaba a claimmix-qa. Con el respaldo
          # entre paréntesis nunca queda vacío, y el primer comando corta.
          CRON_SECRET: ${{ endsWith(env.URL, '-qa.vercel.app') && (secrets.QA_CRON_SECRET || '__falta__') || (secrets.CRON_SECRET || '__falta__') }}
        run: |
          set -uo pipefail

          [ "${CRON_SECRET}" != '__falta__' ] || { echo '::error::Falta el CRON_SECRET de este host (QA_CRON_SECRET para claimmix-qa, CRON_SECRET para claimmix-dev).'; exit 1; }

          # El log puede ser público: sólo contadores y estado, nunca los caseIds ni las listas.
          # Lo que no es JSON (la página de error de Vercel) sale en corto.
          resumen() {
            jq -c '{ok, reaped, retomados, abandoned_closed, recordatorios_enviados, desvios_nuevos, desvios_fallidas: (.desvios_fallidas | if type == "array" then length else null end), error} | with_entries(select(.value != null))' respuesta.json 2>/dev/null ||
              { head -c 300 respuesta.json 2>/dev/null; echo; }
          }

          # Tres intentos: la red de un runner se corta sola de vez en cuando, y
          # un barrido que no salió no es una incidencia — lo es que no salga
          # ninguno. Sólo se falla si fallan los tres.
          #
          # --max-time pasa los 300 s de la ruta: retomando pendientes puede usarlos
          # enteros, y cortarla antes la deja corriendo mientras el reintento larga
          # otro barrido encima.
          for intento in 1 2 3; do
            codigo=$(curl -sS -o respuesta.json -w '%{http_code}' \
              --max-time 320 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${URL}/api/cron/reap-stuck" || echo "000")

            if [ "${codigo}" = "200" ]; then
              echo "HTTP 200 en el intento ${intento}"
              resumen

              # Cuántos escaló, para que quede en el historial del workflow: si
              # esto empieza a devolver números todos los días, el problema no
              # es el barrido sino lo que traba los casos.
              reaped=$(grep -o '"reaped":[0-9]*' respuesta.json | head -1 | cut -d: -f2)
              if [ -n "${reaped:-}" ] && [ "${reaped}" != "0" ]; then
                echo "::warning::Se escalaron ${reaped} caso(s) trabado(s)."
              fi

              # La revisión nocturna (B22) corre con la primera llamada del día. Si una
              # regla falló, el barrido corrió igual, pero esto se pone rojo: el log de
              # Vercel solo no lo mira nadie. No se reintenta: el cupo del día ya se gastó.
              fallidas=$(grep -o '"desvios_fallidas":\[[^]]*]' respuesta.json | head -1 | cut -d: -f2-)
              if [ -n "${fallidas:-}" ] && [ "${fallidas}" != "[]" ]; then
                echo "::error::La revisión nocturna (B22) no corrió estas reglas: ${fallidas}. El barrido sí corrió; el código está en los logs de Vercel (desvios.regla_fallo)."
                exit 1
              fi
              exit 0
            fi

            echo "intento ${intento}: HTTP ${codigo}"
            [ "${intento}" -lt 3 ] && sleep 10
          done

          echo "::error::El barredor no contestó 200 en tres intentos (último: ${codigo})."
          resumen
          exit 1

      - name: Que significa que esto falle
        if: ${{ failure() && steps.salud.outcome == 'failure' }}
        env:
          AMBIENTE: ${{ endsWith(env.URL, '-qa.vercel.app') && 'QA' || 'DEV' }}
        run: |
          echo "::error::${AMBIENTE} no está sano, y no hubo ningún deploy que lo causara."
          echo ""
          echo "  La salida de arriba trae cada chequeo con su nombre y su estado; el detalle"
          echo "  no se imprime porque el log puede ser publico: correr scripts/mirar-salud.mjs a mano."
          echo "  Lo que este endpoint ve se rompe solo — token de WhatsApp vencido,"
          echo "  push de Gmail caido, R2 sin credenciales, presupuesto de IA agotado."

  # ── Prd: lo mismo, con lo suyo ───────────────────────────────────────────────
  #
  # El barrido y la salud de producción de verdad, en un solo job: corre con el
  # cron de las dos horas y no con el de dev. Va con su propio secreto y su propia
  # URL (`vars.PRD_URL`); sin la variable el job se saltea y no gasta minutos, que
  # es el estado de antes de que exista prd.
  #
  # El barrido es el de `barrer`, copiado: el secreto de dev y el de prd no
  # comparten ninguna expresión, a propósito. La URL pasa por la misma lista de
  # hosts de ClaimMix que los demás.
  prd:
    name: PRD · Barrer trabados y mirar la salud
    if: github.event.schedule == '23 */2 * * *' && vars.PRD_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ¿A dónde apunta esto?
        env:
          URL: ${{ vars.PRD_URL }}
        run: |
          set -u
          case "$URL" in
            https://*) ;;
            *) echo "::error::La URL tiene que empezar con https://"; exit 1 ;;
          esac
          HOST="${URL#https://}"
          case "$HOST" in
            *[/?#@:]*) echo "::error::La URL no puede llevar ruta, puerto, credenciales ni fragmento: ${HOST}"; exit 1 ;;
          esac
          node scripts/lib/hosts-vetados.mjs --conocido "$URL" ||
            { echo "::error::Host fuera de la lista: ${HOST}"; exit 1; }

      - name: Pedirle al barredor que pase
        env:
          CRON_SECRET: ${{ secrets.PRD_CRON_SECRET }}
          URL: ${{ vars.PRD_URL }}
        run: |
          set -uo pipefail

          [ -n "${CRON_SECRET}" ] || { echo '::error::Falta PRD_CRON_SECRET.'; exit 1; }

          # El log puede ser público: sólo contadores y estado, nunca los caseIds ni las listas.
          # Lo que no es JSON (la página de error de Vercel) sale en corto.
          resumen() {
            jq -c '{ok, reaped, retomados, abandoned_closed, recordatorios_enviados, desvios_nuevos, desvios_fallidas: (.desvios_fallidas | if type == "array" then length else null end), error} | with_entries(select(.value != null))' respuesta.json 2>/dev/null ||
              { head -c 300 respuesta.json 2>/dev/null; echo; }
          }

          for intento in 1 2 3; do
            codigo=$(curl -sS -o respuesta.json -w '%{http_code}' \
              --max-time 320 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${URL}/api/cron/reap-stuck" || echo "000")

            if [ "${codigo}" = "200" ]; then
              echo "HTTP 200 en el intento ${intento}"
              resumen

              reaped=$(grep -o '"reaped":[0-9]*' respuesta.json | head -1 | cut -d: -f2)
              if [ -n "${reaped:-}" ] && [ "${reaped}" != "0" ]; then
                echo "::warning::Se escalaron ${reaped} caso(s) trabado(s)."
              fi

              fallidas=$(grep -o '"desvios_fallidas":\[[^]]*]' respuesta.json | head -1 | cut -d: -f2-)
              if [ -n "${fallidas:-}" ] && [ "${fallidas}" != "[]" ]; then
                echo "::error::La revisión nocturna (B22) no corrió estas reglas: ${fallidas}. El barrido sí corrió; el código está en los logs de Vercel (desvios.regla_fallo)."
                exit 1
              fi
              exit 0
            fi

            echo "intento ${intento}: HTTP ${codigo}"
            [ "${intento}" -lt 3 ] && sleep 10
          done

          echo "::error::El barredor no contestó 200 en tres intentos (último: ${codigo})."
          resumen
          exit 1

      - name: Preguntarle al deploy que alcanza a ver
        env:
          CRON_SECRET: ${{ secrets.PRD_CRON_SECRET }}
          URL: ${{ vars.PRD_URL }}
        run: node scripts/mirar-salud.mjs
