name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Una corrida por rama. Acá sí se cancela la anterior: no toca nada de afuera
# —tipos, lint, tests, build en un runner limpio— así que el resultado del
# commit viejo no le importa a nadie apenas llegó uno nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Reusable setup steps (defined as env defaults) ────────────────────────────
env:
  NODE_VERSION: "22"
  # pnpm 11.5 supply-chain policy: next@16.2.7 was published <24h before this CI run.
  # Disabling the release-age hold — lockfile pins exact SHAs for supply-chain integrity.
  npm_config_minimum_release_age: "0"

jobs:
  # ── 1. Type check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          # La capa de datos usa su propio rol. Sin esta variable, cualquier
          # consulta tira "falta DATABASE_URL_APP" antes de tocar la base.
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder

  # ── 2. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ── 3. Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          # La capa de datos usa su propio rol. Sin esta variable, cualquier
          # consulta tira "falta DATABASE_URL_APP" antes de tocar la base.
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder
          MOCK_AI: "true"

      # Aparte de los unitarios porque necesitan el compilador de flujos, que
      # traduce las directivas "use workflow" / "use step". Sin él esas
      # directivas son literales de cadena que no hacen nada: la función corre
      # igual, el test pasa, y la durabilidad no existe. No tocan la base.
      - name: Run durable-workflow tests
        run: pnpm flujos
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          # La capa de datos usa su propio rol. Sin esta variable, cualquier
          # consulta tira "falta DATABASE_URL_APP" antes de tocar la base.
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder
          MOCK_AI: "true"

  # ── 4. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          # La capa de datos usa su propio rol. Sin esta variable, cualquier
          # consulta tira "falta DATABASE_URL_APP" antes de tocar la base.
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-only
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          MOCK_AI: "true"

  # ── 5. Integration tests ─────────────────────────────────────────────────────
  # Runs when INTEGRATION_ENABLED secret is set; skipped otherwise (no live Neon DB).
  # To enable: set INTEGRATION_ENABLED=true in GitHub Actions secrets.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      # Un secreto no se puede leer desde un `if:`; una variable de entorno sí.
      HAY_ENSAYO: ${{ secrets.STAGING_DATABASE_URL }}
    permissions:
      contents: read
    continue-on-error: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Estos 204 tests no corrieron nunca hasta hoy.
      #
      # Necesitan tres cosas: una base con datos, un usuario con contraseña, y
      # un servidor HTTP contra el que hacer `fetch`. La segunda parecía
      # imposible —el alta exige dirección verificada, que es una defensa
      # deliberada— hasta que se vio que eso gobierna la PROVISIÓN y no la
      # creación de la cuenta. `pnpm sembrar` hace lo mismo que hace un admin
      # cuando da de alta a alguien: crea la cuenta y después escribe el perfil.
      #
      # Corren contra el ENSAYO y con su rol restringido. Nunca contra
      # producción: sembrar un usuario con contraseña conocida en la base donde
      # viven denuncias reales es una puerta abierta con la llave puesta. El
      # script se planta solo si le pasan la cadena de producción.
      # El `if` mira `env` y no `secrets` porque el contexto `secrets` no está
      # disponible en una condición: el workflow ni siquiera arranca. Se mapea
      # una vez al entorno del job y se pregunta por ahí.
      - name: Sembrar la base del ensayo
        if: env.HAY_ENSAYO != ''
        run: pnpm sembrar
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Levantar el servidor
        if: env.HAY_ENSAYO != ''
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:3000/api/health" && break
            # 401 es "está arriba y pide credenciales", que alcanza.
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = "401" ] && break
            sleep 2
          done
          curl -s -o /dev/null -w "servidor: %{http_code}" http://localhost:3000/api/health
          # Calentar las rutas que los tests van a golpear.
          #
          # En modo desarrollo Next compila cada ruta la primera vez que alguien
          # la pide, y esa primera vez se come varios segundos. El primer test
          # que inicia sesion se llevaba ese costo y se pasaba del tiempo: un
          # rojo que no dice nada del producto, solo de cuando llego.
          for r in /login /api/auth/get-session /api/cases; do
            curl -s -o /dev/null -m 30 "http://localhost:3000$r" || true
          done
          echo "rutas calientes"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # El rol RESTRINGIDO del ensayo, no el dueño. Con el dueño, RLS no
          # aplica y la aplicación sirve los datos de todos los inquilinos —
          # pasó exactamente eso al armar estos tests. La capa ahora se planta
          # sola si le dan un rol con BYPASSRLS, y este job lo comprueba de
          # punta a punta.
          DATABASE_URL_APP: ${{ secrets.STAGING_DATABASE_URL_APP }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          MOCK_AI: "true"

      - name: Run integration tests
        run: |
          if [ "${{ secrets.STAGING_DATABASE_URL }}" != "" ]; then
            INTEGRATION_ENABLED=true pnpm test:integration
          else
            {
              echo "### 204 tests de integración no corrieron"
              echo ""
              echo "Falta el secreto \`STAGING_DATABASE_URL\` (y \`STAGING_DATABASE_URL_APP\`)."
              echo "Corren contra el ensayo, nunca contra producción."
              echo ""
              echo "En local: \`pnpm sembrar\`, levantar el servidor, y \`pnpm test:integration\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Integración sin correr::Falta STAGING_DATABASE_URL — ver el resumen del run."
          fi
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || 'postgresql://placeholder:placeholder@placeholder/placeholder' }}
          DATABASE_URL_APP: ${{ secrets.STAGING_DATABASE_URL_APP || 'postgresql://placeholder:placeholder@placeholder/placeholder' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'placeholder-secret' }}
          MOCK_AI: "true"

  # ── Cobertura, como trinquete ────────────────────────────────────────────────
  #
  # El piso está en `vitest.config.ts` y es el número real de hoy, no una
  # aspiración: estaba en 80 con una cobertura de 70, así que fallaba siempre y
  # nadie lo miraba. Una barrera que no se cruza nunca no frena nada.
  #
  # Así el número puede subir y no puede bajar. Cuando sube de verdad, se sube
  # el piso en el mismo commit.
  cobertura:
    name: Cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Medir
        run: pnpm cobertura
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder
          MOCK_AI: "true"

      - name: Qué significa que esto falle
        if: failure()
        run: |
          echo "::error title=La cobertura bajó::Un cambio agregó código sin tests, o borró tests."
          echo ""
          echo "  Reproducilo con: pnpm cobertura"
          echo "  El detalle por archivo sale en la tabla que imprime."
          echo ""
          echo "  Si el código nuevo es imposible de probar en unitarios, va al"
          echo "  \`exclude\` de vitest.config.ts CON EL MOTIVO — no se baja el piso."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ── 6. E2E tests ─────────────────────────────────────────────────────────────
  #
  # Requiere una base viva para que arranque el servidor. Sin el secreto: aviso
  # en un pull request —puede venir de un fork, que no recibe secretos— y ERROR
  # en `main`, donde sí están y que falten significa que alguien los sacó.
  #
  # Tenía `continue-on-error: true`, o sea que un rojo acá no rompía nada. Y
  # estuvo en rojo, sin que nadie lo viera, durante días: un test exigía que
  # /api/admin/health devolviera un bloque de configuración que había dejado de
  # ser booleano. CI decía "success" en cada push.
  #
  # Una suite que no puede hacer fallar el build no es una suite, es un adorno.
  # Si esto se pone inestable, lo que hay que arreglar es la inestabilidad.
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Sin secreto NO se saltea en silencio.
      #
      # Antes esto imprimía "[skip] E2E tests skipped" y el job quedaba en
      # VERDE. Un check verde que no probó nada es peor que no tenerlo: se lee
      # como cobertura y no existe. Los e2e necesitan una base para que arranque
      # el servidor, así que no se pueden correr sin ella — pero eso tiene que
      # verse.
      #
      # En un pull request queda como aviso: puede venir de un fork, que por
      # diseño no recibe secretos. En `main` falla, porque ahí sí están y que
      # falten significa que alguien los sacó.
      - name: Run E2E tests
        run: |
          if [ "${{ secrets.DATABASE_URL }}" != "" ]; then
            pnpm test:e2e --project=chromium
          elif [ "${{ github.event_name }}" = "push" ]; then
            {
              echo "### Los e2e no corrieron"
              echo ""
              echo "Falta el secreto \`DATABASE_URL\`. Playwright levanta el servidor"
              echo "con \`pnpm dev\`, y sin base el servidor no arranca."
              echo ""
              echo "**Trece de estos tests no necesitan datos**: cabeceras, nonce de la"
              echo "CSP por pedido, iframe, límite de tráfico, y que las rutas del motor"
              echo "de flujos no acepten trabajo de afuera. Sólo necesitan que el"
              echo "servidor levante."
              echo ""
              echo "Se prende apuntando al ENSAYO, nunca a producción:"
              echo ""
              echo '```'
              echo 'gh secret set DATABASE_URL --body "$STAGING_DATABASE_URL"'
              echo 'gh secret set DATABASE_URL_APP --body "$STAGING_DATABASE_URL"'
              echo 'gh secret set BETTER_AUTH_SECRET --body "$(openssl rand -hex 32)"'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=E2E sin correr::Falta el secreto DATABASE_URL. 13 tests de seguridad que no necesitan datos quedaron sin correr — el resumen del run tiene el comando exacto."
            exit 1
          else
            echo "::warning title=E2E sin correr::Falta DATABASE_URL — normal en un fork. Los e2e NO se probaron en este PR."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@placeholder/placeholder' }}
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP || 'postgresql://placeholder:placeholder@placeholder/placeholder' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'placeholder-secret' }}
          MOCK_AI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ── 7. Security audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (HIGH+, production)
        run: pnpm audit --audit-level=high --prod
        # Blocking gate: only what actually ships. Fix a finding here by bumping
        # the dependency or adding a pnpm.overrides entry in package.json.
        #
        # Scoped to --prod because the dev toolchain currently pins an
        # unfixable advisory: eslint -> minimatch@3 -> brace-expansion@1.
        # brace-expansion is only patched in >=5.0.8, whose API minimatch@3
        # cannot consume ("expand is not a function"), so there is no version
        # that is both patched and working. It never reaches runtime.
        continue-on-error: false

      - name: Audit dependencies (HIGH+, including dev) — informational
        run: pnpm audit --audit-level=high || true
        # Visibility only, never blocks: surfaces dev-tooling advisories so they
        # can be picked up whenever the upstream toolchain ships a fix.
        continue-on-error: true

      - name: Semgrep SAST (OWASP Top 10 + secrets)
        run: |
          pip install semgrep --quiet
          semgrep --config=auto src/ \
            --error \
            --quiet \
            --exclude="*.test.ts" \
            --exclude="*.test.tsx" \
            --exclude="*.spec.ts" \
            --exclude="*.spec.tsx"
        # Sin `|| true` y sin `continue-on-error`, que es lo que tenía.
        #
        # Con las dos redes puestas, Semgrep venía encontrando 6 hallazgos —cuatro
        # marcados Blocking por él mismo— y el job quedaba verde en cada commit.
        # Nadie los miró nunca porque el ícono estaba bien. Dos eran de verdad:
        # `gcm-no-tag-length` en los dos lugares donde se descifra un token de
        # Gmail, o sea el permiso permanente sobre la casilla de una aseguradora.
        #
        # Los otros cuatro eran falsos positivos y están marcados uno por uno en el
        # código con `// nosemgrep` y el motivo al lado. Ésa es la salida cuando una
        # regla se equivoca: nombrar el caso, no apagar el chequeo entero. Si una
        # actualización de reglas trae ruido nuevo, esto se pone rojo — que es
        # exactamente lo que tiene que pasar para que alguien lo mire.

  # ── 8. Bundle size check ─────────────────────────────────────────────────────
  bundle-size:
    name: Bundle size check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build]
    continue-on-error: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for bundle analysis
        run: pnpm build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          # La capa de datos usa su propio rol. Sin esta variable, cualquier
          # consulta tira "falta DATABASE_URL_APP" antes de tocar la base.
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-only
          MOCK_AI: "true"
          ANALYZE: "true"

      # Este paso imprimía "Bundle size check passed" SIEMPRE.
      #
      # Leía el manifiesto y lo tiraba, y después corría
      # `size-limit || true` — un paquete que ni siquiera está instalado.
      # O sea: un verde por commit, durante meses, sobre un número que
      # nadie miró nunca.
      #
      # `pnpm peso` comprime los chunks del build con gzip y compara contra
      # un presupuesto. Sin dependencias nuevas, y falla si se pasa.
      - name: Cuánto JavaScript le llega al navegador
        run: pnpm peso

      - name: Qué significa que esto falle
        if: failure()
        run: |
          echo "::error title=El paquete engordó::Algo agregó peso al JavaScript que baja el navegador."
          echo ""
          echo "  Reproducilo con: pnpm build && pnpm peso"
          echo "  Muestra los chunks más grandes, que es por dónde empezar."
          echo ""
          echo "  Si el peso nuevo hace falta de verdad, subí el tope en"
          echo "  scripts/medir-peso.mjs y decí en el commit por qué. Un tope que"
          echo "  se sube solo cada vez que alguien lo pasa no es un tope."
  # ── 9. Integration tests (Gmail polling) ────────────────────────────────────
  # Replaces the old Postmark intake integration tests (W5: Postmark removed).
  # Tests Gmail polling, 410 stub, and route auth — all mock-only (no real Gmail creds).
  integration-tests-email:
    name: Integration tests (Gmail polling)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gmail polling integration tests (mock-only)
        # intake-email-gone.test.ts verifies the 410 stub (AC11).
        # gmail-poll.test.ts covers the full polling pipeline (AC1-AC4, AC7, AC8, AC13-AC14).
        # All tests use mocked @/lib/db — no real DB connection needed.
        run: pnpm vitest run tests/integration/intake-email-gone.test.ts tests/integration/gmail-poll.test.ts tests/integration/rls-email.test.ts tests/integration/llm-email-probes.test.ts
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          # La capa de datos usa su propio rol. Sin esta variable, cualquier
          # consulta tira "falta DATABASE_URL_APP" antes de tocar la base.
          DATABASE_URL_APP: postgresql://placeholder:placeholder@placeholder/placeholder
          MOCK_AI: "true"

  # ── 10. License audit ────────────────────────────────────────────────────────
  license-audit:
    name: License audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for GPL/AGPL/LGPL/SSPL licenses (deny list)
        run: |
          # Install license checker
          pnpm dlx license-checker-rseidelsohn --failOn 'GPL;AGPL;LGPL;SSPL' \
            --excludePrivatePackages \
            --production
        # Sin `|| echo` y sin `continue-on-error`. Eran tres redes sobre el mismo
        # chequeo —el `|| echo` ya forzaba salida 0, así que los dos
        # `continue-on-error` ni llegaban a actuar— y el resultado era un job que
        # no podía fallar por ningún camino. Hoy pasa limpio: comprobado corriendo
        # el checker a mano antes de sacarle la red. Si mañana entra una
        # dependencia GPL, ahora se entera alguien.
