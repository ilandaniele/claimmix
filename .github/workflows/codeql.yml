name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # Sin `prd` a propósito: tests/unit/ci-prd.test.ts lo fija.
    branches: [main, qa]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Una corrida por rama; la anterior se cancela. Análisis estático puro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Análisis CodeQL
    runs-on: ubuntu-latest
    permissions:
      # Required for CodeQL to upload results
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El evento `schedule` no documenta `repository` en su payload; la API
      # dice si el repo es privado para cualquier evento.
      - name: Visibilidad del repo
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # `actions` analiza los workflows: inyección de `${{ }}` en `run`,
          # permisos de más, `pull_request_target`. No necesita build. Va en el
          # mismo job para que el nombre del check requerido no cambie.
          languages: javascript-typescript,actions
          # CodeQL queries: security-extended covers OWASP Top 10
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # Un repo privado sin Advanced Security rechaza el SARIF. El análisis
          # corre igual y el paso siguiente lo lee acá. Sólo la subida depende
          # de la visibilidad: el gate de abajo corre siempre.
          upload: ${{ steps.repo.outputs.private == 'true' && 'never' || 'always' }}
          output: sarif

      # Sin la pestaña de seguridad nadie ve los hallazgos, así que el job
      # falla con los de gravedad alta o crítica (security-severity >= 7), el
      # mismo umbral con el que GitHub marca rojo un PR cuando sí hay subida.
      # Los descartados después de revisarlos viven en codeql-descartados.txt.
      # Lee el SARIF de cada lenguaje, así que cubre también los workflows.
      #
      # Corre también con el repo público. Antes no, y ahí el SARIF se subía
      # pero las alertas no hacen fallar el job: un hallazgo grave dejaba el
      # check en verde.
      - name: Hallazgos graves
        run: |
          jq -r '
            .runs[] as $r
            | ([$r.tool.driver.rules[]?, $r.tool.extensions[]?.rules[]?]
               | map({key: .id, value: (.properties["security-severity"] // "0" | tonumber)})
               | from_entries) as $sev
            | $r.results[]
            | select(($sev[.ruleId] // 0) >= 7)
            | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri) \(.locations[0].physicalLocation.region.startLine)"
          ' sarif/*.sarif | sort -u > graves.txt
          awk 'NR == FNR { if ($0 !~ /^[[:space:]]*(#|$)/) ok[$1 " " $2] = 1; next }
               !(($1 " " $2) in ok)' .github/codeql-descartados.txt graves.txt > nuevos.txt
          echo "Resultados de CodeQL: $(jq -s '[.[].runs[].results[]] | length' sarif/*.sarif); graves: $(wc -l < graves.txt), sin descartar: $(wc -l < nuevos.txt)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s nuevos.txt ]; then
            { echo '```'; cat nuevos.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat nuevos.txt
            exit 1
          fi
