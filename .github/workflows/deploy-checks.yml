# Qué pregunta cada uno de estos siete chequeos, en detalle.
#
# CI ya corre en cada push: tipos, lint, tests, build. Todo eso pasa en un
# runner limpio y no dice nada sobre el entorno de producción — que es donde
# fallan las cosas que más caro salen. R2 funcionó en cada corrida local
# durante horas mientras producción descartaba todos los adjuntos, porque las
# credenciales nunca se habían cargado en Vercel. Nada falló en voz alta.
#
# Esto le pregunta al deploy recién promovido qué alcanza a ver: base de datos,
# migraciones aplicadas, almacenamiento (con una subida real), el modelo (con
# una llamada real), el token de WhatsApp y la casilla conectada.
#
# Primero espera a que el alias sirva el commit de este deploy. Sin eso el
# chequeo puede interrogar al build anterior y darlo por bueno, que es la
# respuesta más peligrosa posible: la que tapa justo el deploy que se está
# preguntando.
#
# El smoke sólo necesita un secreto, CRON_SECRET: interroga al deploy, y todo
# lo demás ya vive adentro. Los otros tres trabajos no — el ensayo, la carga y
# la pared entre tenants corren el código acá, en el runner, contra la base de
# producción, así que necesitan sus credenciales y su configuración. Lo que
# olvidan es lo segundo: una variable que falta acá no rompe nada en voz alta,
# toma otro default que producción y prueba algo que no es producción.
#
# ── Por qué es un workflow reusable ──────────────────────────────────────────
#
# Quien decide CUÁNDO correr esto no es siempre el mismo caller: post-deploy.yml
# lo llama contra producción, y un segundo proyecto de Vercel para QA lo va a
# llamar contra su propia URL, con su propia base. Cada caller separa la URL y
# los secretos con `with:` y `secrets: inherit`; `entorno` sólo identifica cuál
# llamó — hoy ningún job de acá adentro lo usa todavía, queda declarado para
# cuando un caller lo necesite (por ejemplo, para distinguirlo en un mensaje).

name: Chequeos del deploy

on:
  workflow_call:
    inputs:
      url:
        description: "URL contra la que correr los siete chequeos"
        required: true
        type: string
      entorno:
        description: "Nombre del entorno que llama (Production, QA…), sólo para identificarlo"
        required: true
        type: string
      medir_carga:
        description: "Si corre el job `carga`. Ver su comentario: QA no lo mide."
        required: false
        type: boolean
        default: true
      # ── Qué puede correr cada entorno ───────────────────────────────────────
      #
      # No todos los chequeos tienen sentido en todos lados. QA no lleva Gmail
      # ni WhatsApp —no le escribe a nadie, a propósito—, así que el timbre no
      # tiene a qué tocarle. El pen test sí corre en QA: como allá no hay
      # inquilino de demo, arma el suyo (`pared_propia`) y puede atacar al
      # agente (`atacar_agente`), que en producción no se toca.
      #
      # Apagarlos acá no es esconderlos: el job `alcance`, al final, nombra uno
      # por uno los que no corrieron y por qué. Lo que no se puede hacer es
      # dejar que un caller no los corra EN SILENCIO, que es de donde venía el
      # verde por ausencia.
      smoke_profundo:
        description: "Si el smoke corre con --deep (sube a R2 y llama al modelo)"
        required: false
        type: boolean
        default: true
      smoke_tolera:
        description: "Chequeos de salud que este entorno no configura (coma)"
        required: false
        type: string
        default: ""
      correr_ensayo:
        description: "Si corre el ensayo de conversaciones"
        required: false
        type: boolean
        default: true
      correr_timbre:
        description: "Si corre el timbre. QA no: no tiene Gmail ni WhatsApp."
        required: false
        type: boolean
        default: true
      correr_pentest:
        description: "Si corre el pen test"
        required: false
        type: boolean
        default: true
      pared_propia:
        description: "Si el pen test arma su inquilino B y su caso señuelo (--pared-propia). Sólo QA: producción lo rechaza."
        required: false
        type: boolean
        default: false
      atacar_agente:
        description: "Si el pen test ataca al agente (--agent). Gasta tokens y escribe casos: sólo QA."
        required: false
        type: boolean
        default: false
    # ── Por qué los secretos van declarados y no heredados ────────────────────
    #
    # `secrets: inherit` le pasa al workflow los secretos del caller con SU
    # nombre. Para producción alcanza. Para QA es peligroso: seis de los siete
    # jobs corren en el runner y hablan con la base por `DATABASE_URL`, y tres
    # de ellos ESCRIBEN. Heredando, una corrida de QA crearía y borraría casos
    # en la base de un cliente.
    #
    # Declarándolos, el caller de QA puede mapear `QA_DATABASE_URL` a
    # `DATABASE_URL` por nombre. Todos van `required: false` a propósito: el
    # que falta no rompe la llamada, rompe el job que lo necesita, con el
    # mensaje del script que lo pide. Un secreto ausente tiene que verse.
    #
    # `BETTER_AUTH_SECRET` NO está y no se hereda: el ensayo, el timbre, la
    # carga y el pen test corren el código acá, en el runner, y ninguno firma
    # una cookie que un deploy tenga que aceptar. Cada job que importa
    # `@/lib/auth` se genera el suyo (`openssl rand -hex 32`, como `ci.yml`);
    # el de verdad no sale de Vercel hacia un runner.
    secrets:
      CRON_SECRET:
        required: false
      DATABASE_URL:
        required: false
      DATABASE_URL_APP:
        required: false
      GMAIL_TENANT_ID:
        required: false
      GEMINI_TRANSPORT:
        required: false
      GOOGLE_CLOUD_PROJECT:
        required: false
      GOOGLE_CLOUD_LOCATION:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_BUCKET:
        required: false
      WHATSAPP_APP_SECRET:
        required: false
      WHATSAPP_PHONE_NUMBER_ID:
        required: false
      DEMO_TENANT_ID:
        required: false
  # Para poder ensayar este archivo en una rama antes de que tenga un caller:
  # `deployment_status` corre siempre la versión de la rama default, y lo
  # mismo vale para `workflow_call` — el archivo que define el job que llama
  # (post-deploy.yml) se resuelve ahí. Sin este trigger propio no hay forma de
  # probar un cambio acá sin mergearlo primero.
  workflow_dispatch:
    inputs:
      url:
        description: "URL contra la que correr los siete chequeos"
        required: true
        type: string
      # Los mismos interruptores que el caller, repetidos acá a propósito: si no
      # están, `inputs.correr_ensayo` vale vacío en una corrida a mano y los
      # jobs se saltean solos. Un archivo que a mano corre otra cosa que la que
      # corre por caller no sirve para ensayarlo antes de mergearlo.
      #
      # Salvo `pared_propia` y `atacar_agente`: escriben, no corren contra
      # producción, y a mano el smoke sólo admite producción. Ofrecerlos acá era
      # un formulario que siempre termina en rojo; sólo los pasa `workflow_call`.
      smoke_profundo:
        description: "Si el smoke corre con --deep (sube a R2 y llama al modelo)"
        required: false
        type: boolean
        default: true
      smoke_tolera:
        description: "Chequeos de salud que este entorno no configura (coma)"
        required: false
        type: string
        default: ""
      correr_ensayo:
        description: "Si corre el ensayo de conversaciones"
        required: false
        type: boolean
        default: true
      correr_timbre:
        description: "Si corre el timbre"
        required: false
        type: boolean
        default: true
      correr_pentest:
        description: "Si corre el pen test"
        required: false
        type: boolean
        default: true
      medir_carga:
        description: "Si corre la medición de carga"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke del deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sin guarda de entorno acá: la decide quien llama. Por workflow_call es
    # el job `produccion` de post-deploy.yml (o, mañana, el de QA); por
    # workflow_dispatch directo sobre este archivo, dispararlo a mano ya es
    # la decisión.
    steps:
      # Primero el repositorio: la lista de hosts de ClaimMix vive en
      # scripts/lib/hosts-vetados.mjs y la leen los workflows y los guiones.
      # Historia completa: el chequeo compara el commit que pidió este run
      # con el que producción está sirviendo, y para saber cuál viene
      # después necesita `merge-base`. Con el clon de un solo commit no
      # puede, y ante la duda falla — que es el comportamiento viejo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Este workflow recibe la URL de su caller (o de quien lo dispare a
      # mano) y siete jobs cuelgan de este primero, todos con secretos. Antes
      # de que exista ninguno, se comprueba a qué despliegue apunta.
      #
      # Sólo los hosts de ClaimMix, no las vistas previas: `CRON_SECRET` es el
      # de dev, el de QA o el de prd, y una vista previa construida desde una
      # rama tiene el suyo (`PREVIEW_CRON_SECRET`, que sólo usa load-tests.yml).
      - name: ¿A dónde apunta esto?
        env:
          URL: ${{ inputs.url }}
          EVENTO: ${{ github.event_name }}
          PRD_URL: ${{ vars.PRD_URL }}
        run: |
          set -u
          case "$URL" in
            https://*) ;;
            *) echo "::error::La URL tiene que empezar con https://"; exit 1 ;;
          esac
          HOST="${URL#https://}"
          case "$HOST" in
            *[/?#@:]*) echo "::error::La URL no puede llevar ruta, puerto, credenciales ni fragmento: ${HOST}"; exit 1 ;;
          esac
          node scripts/lib/hosts-vetados.mjs --conocido "$URL" ||
            { echo "::error::Host fuera de la lista: ${HOST}"; exit 1; }
          # Por workflow_dispatch los secretos son los de dev (los de QA sólo
          # los mapea el job `qa` de post-deploy.yml, por deployment_status),
          # así que el único destino que les corresponde es el alias de dev.
          # `github.event_name` es el del caller: por workflow_call desde
          # post-deploy.yml vale lo mismo que allá, y ahí el disparo a mano ya
          # llega con la URL de dev.
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$HOST" != "claimmix-dev.vercel.app" ]; then
            echo "::error::Un disparo a mano corre con los secretos de dev y sólo admite claimmix-dev.vercel.app, no ${HOST}"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Chequear el deploy
        # --deep sube un archivo a R2 y llama al modelo de verdad. Cuesta
        # centavos y es la diferencia entre "las variables están" y "funciona".
        #
        # Contra el alias, no contra la URL del deploy: el alias es lo que usan
        # los asegurados, y --expect-commit se encarga de que sea este build y
        # no el anterior.
        #
        # Lo que viene del evento entra por `env:` y no interpolado en el shell:
        # una URL con una comilla adentro sería un comando en un job que tiene
        # CRON_SECRET. Es el mismo patrón que barrer-trabados y load-tests.
        #
        # `--deep` lo decide el caller. QA no tiene R2 ni modelo cargados, y una
        # subida que no se puede hacer no es un chequeo: es un rojo fijo.
        #
        # `SMOKE_TOLERA` va por entorno y no interpolado en el comando: una
        # lista con un espacio se partiría en dos argumentos y el segundo lo
        # comería `--url`. El script la lee del entorno (`smoke-production.mts`).
        run: |
          pnpm smoke -- $PROFUNDO --url "$URL" $EXPECT
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ inputs.url }}
          PROFUNDO: ${{ inputs.smoke_profundo && '--deep' || '' }}
          SMOKE_TOLERA: ${{ inputs.smoke_tolera }}
          # `github.event` es el del run entero, no el de este archivo: si lo
          # que disparó la corrida fue un deployment_status (el caso de
          # producción, vía workflow_call), acá está su sha y lo exigimos. Si
          # esto se disparó por workflow_dispatch — acá mismo, sin caller —
          # no hay deployment que comparar y EXPECT queda vacío.
          EXPECT: ${{ github.event.deployment.sha && format('--expect-commit {0}', github.event.deployment.sha) || '' }}

      - name: Qué hacer si esto falló
        if: failure()
        run: |
          echo "::error::El deploy salió pero producción no está sana."
          echo ""
          echo "Mirá el detalle arriba. Los tres casos habituales:"
          echo ""
          echo "  · 'faltan columnas'   → hay una migración sin aplicar en Neon."
          echo "                          Los deploys no las corren solas."
          echo "  · 'sin configurar'    → falta una variable en Vercel."
          echo "  · 'sigue sirviendo X' → el alias no se movió al build nuevo."
          echo ""
          echo "Reproducilo con: pnpm smoke --deep"

  # ── El ensayo de conversaciones ──────────────────────────────────────────────
  #
  # Dieciocho denuncias enteras contra el agente real, por WhatsApp y por mail,
  # sobre los canales simulados. No le manda un mensaje a nadie.
  #
  # Corre después del smoke y sólo si pasó: si producción no puede llegar a la
  # base o al modelo, el ensayo va a fallar por eso y el resultado no dice nada
  # sobre el agente.
  #
  # Usa la base de PRODUCCIÓN. Escribe dieciocho casos y los borra al terminar,
  # y al empezar barre los que hayan quedado de una corrida que se murió a
  # mitad de camino. Se los reconoce por identidades inventadas — números
  # 5490000… y direcciones ensayo.*@example.com — que ningún asegurado real
  # puede tener.
  #
  # El reconocimiento de documentos no se ejercita acá: necesita fotos reales, y
  # una licencia de verdad no entra ni al repositorio ni a los secretos de
  # GitHub. El ensayo avisa que esa parte no la probó.
  rehearse:
    name: Ensayo de conversaciones
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [smoke]
    # Lo apaga el caller que no lo puede correr. El job `alcance`, al final, lo
    # nombra: apagado y dicho no es lo mismo que apagado y callado.
    if: inputs.correr_ensayo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub firma un token OIDC para este job y Google lo acepta por Workload
      # Identity Federation (proveedor `github`, sólo este repo y sólo `main`).
      # La acción escribe un archivo de credenciales y apunta
      # GOOGLE_APPLICATION_CREDENTIALS a él: el ensayo entra por ADC.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: claimmix-506321
          workload_identity_provider: projects/1032332436198/locations/global/workloadIdentityPools/vercel/providers/github
          service_account: claimmix-extractor@claimmix-506321.iam.gserviceaccount.com

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Una diferencia se confirma con una segunda corrida.
      #
      # Del otro lado hay un modelo, no una función: la misma conversación puede
      # terminar distinto. Medido sobre `goteo`, que difirió una vez acá: tres
      # corridas seguidas después, cero diferencias. El escenario estaba bien y
      # el modelo, esa vez, eligió callarse.
      #
      # Reintentar no afloja la exigencia —la afirmación es la misma— sino que
      # separa dos cosas que en un reporte se ven iguales: una regresión, que
      # falla siempre, y una variación, que casi nunca falla dos veces.
      #
      # Lo que separa las dos es la INTERSECCIÓN de las dos corridas, y eso es lo
      # que faltaba. Antes el reintento pedía que la segunda corrida saliera
      # limpia entera, que con medio centenar de afirmaciones dependientes del
      # modelo es tirar otro dado en vez de confirmar el primero: salía rojo por
      # diferencias DISTINTAS cada vez. Un rojo que cambia de motivo en cada
      # corrida enseña a no mirar el reporte, que es peor que no tenerlo.
      #
      # `|| true` en la segunda es a propósito: su código de salida ya no decide
      # nada, decide la comparación. Y un reporte que falta no cuenta como cero
      # diferencias — si el ensayo se cayó antes de escribirlo, eso es rojo.
      #
      # Va acá y no adentro del script porque cada corrida necesita identidades
      # nuevas, y el ensayo las deriva de una constante por proceso. Intentarlo
      # adentro hacía que el reintento cayera en el mismo hilo: las respuestas
      # del primer intento se contaban en el turno 1 del segundo. Un proceso
      # nuevo lo resuelve sin tocar nada.
      #
      # La segunda corrida repite sólo los escenarios que difirieron: la
      # intersección no puede tener nada de los otros, y repetir los veintiséis
      # costaba diez minutos de runner por cada variación del modelo. Si la
      # primera no llegó a escribir su reporte, no se sabe cuáles fueron y se
      # repite entera.
      #
      # El secreto de sesión se genera acá y no va a GITHUB_ENV: lo usa este
      # paso solo. El ensayo habla con la base y con el modelo, no con las
      # cookies de producción: cualquier valor sirve, y el de verdad no sale de
      # Vercel. `::add-mask::` por si algún día un log lo imprime.
      - name: Ensayar las conversaciones
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          if pnpm rehearse --reporte primera.json; then
            exit 0
          fi
          ESCENARIOS=$(node -e 'try { const f = require("./primera.json"); console.log([...new Set(f.map((d) => d.scenario))].join(" ")) } catch {}')
          echo "::notice title=Se repite el ensayo::Difirió algo. Segunda corrida para separar variación de regresión: ${ESCENARIOS:-todos}."
          # shellcheck disable=SC2086 # los nombres van sueltos, uno por argumento
          pnpm rehearse $ESCENARIOS --reporte segunda.json || true
          node scripts/comparar-ensayos.mjs primera.json segunda.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # La capa de datos entra por acá. Sin esto, toda consulta que pase por
          # `enTenant` rompe con "falta DATABASE_URL_APP" — que en el pen test se
          # lee como "la pared entre inquilinos falló" y no como "falta una variable".
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
          GMAIL_TENANT_ID: ${{ secrets.GMAIL_TENANT_ID }}
          GEMINI_TRANSPORT: ${{ secrets.GEMINI_TRANSPORT }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          # El cupo diario de tokens del tenant.
          #
          # El ensayo corre acá, en el runner, no adentro del deploy — así que
          # lee el tope de ESTE entorno. Sin esta línea tomaba el default de 5M
          # mientras producción tiene 20M, y una tarde de pruebas (la carga, el
          # pen test del agente, los ensayos mismos) lo agotaba. Entonces el
          # worker no llama al modelo, el agente se queda mudo, y las doce
          # conversaciones fallan juntas como si se hubiera roto algo.
          #
          # Variable del repo y no secreto: no lo es, y GitHub tacha el valor de
          # un secreto en el log — dejaría «5.088.283 / ***» justo en la línea
          # que explica la falla. Mantenerla igual a la de Vercel.
          AI_TENANT_DAILY_TOKEN_CAP: ${{ vars.AI_TENANT_DAILY_TOKEN_CAP || '20000000' }}
          # El tope de lo que entra sin usuario, que es todo lo que gasta el
          # ensayo. Sin definir vale el 60 % del anterior, igual que en Vercel;
          # si en Vercel se define, hay que definir acá la misma variable del repo.
          AI_ANONIMO_DAILY_TOKEN_CAP: ${{ vars.AI_ANONIMO_DAILY_TOKEN_CAP }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Qué significa que esto falle
        if: failure()
        run: |
          echo "::error::El agente no se comportó como esperábamos."
          echo ""
          echo "El transcripto completo está en el paso de arriba. Leelo: la"
          echo "diferencia que reporta dice qué esperaba, y el mensaje que"
          echo "mandó dice qué hizo en su lugar."
          echo ""
          echo "Reproducilo con: pnpm rehearse <nombre-del-escenario>"

  # ── El timbre ────────────────────────────────────────────────────────────────
  #
  # El ensayo entra por los canales simulados, a propósito: así no le escribe a
  # nadie. Lo que queda afuera de esa decisión es el primer metro — entre que el
  # mensaje aparece en la casilla o llega al webhook, y que el worker lo levanta.
  #
  # Esto lo cubre sin sacar nada del edificio: el deploy DEPOSITA un mail en la
  # casilla (no lo manda), y se le manda al webhook un payload firmado con el
  # secreto de Meta desde un número del bloque reservado. Cuesta dos
  # extracciones y borra los dos casos al terminar.
  #
  # La mitad de WhatsApp necesita WHATSAPP_APP_SECRET para firmar como Meta. Si
  # no está, el job falla: saltearla en silencio dejaba verde un chequeo que
  # no había tocado el webhook, que es darla por probada.
  # Y WHATSAPP_PHONE_NUMBER_ID, que es el número al que le "escribe": el webhook
  # rutea por él, y sin él el evento se descarta y el caso nunca aparece.
  timbre:
    name: Canales de entrada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [smoke]
    # QA no tiene ni casilla ni WhatsApp: no hay timbre que tocar. Lo apaga su
    # caller y el job `alcance` lo nombra como no verificado.
    if: inputs.correr_timbre
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # En GitHub Actions un secreto que no existe llega como cadena vacía, y el
      # script de abajo salteaba WhatsApp con un aviso que nadie lee.
      - name: ¿Está el secreto con el que Meta firma?
        env:
          APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
        run: |
          if [ -z "$APP_SECRET" ]; then
            echo "::error::Falta WHATSAPP_APP_SECRET: sin él no se puede firmar como Meta y la mitad de WhatsApp del timbre queda sin probar."
            exit 1
          fi

      # Secreto de sesión propio de la corrida: ver el ensayo.
      - name: Entrar por los transportes de verdad
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          pnpm knock
        env:
          # Sin esto el script cae a su default, que es la URL de dev
          # (scripts/knock-on-the-door.mts). Un caller de QA tocaría el timbre
          # de producción con la base de QA: lo peor de los dos lados.
          SMOKE_URL: ${{ inputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # La capa de datos entra por acá. Sin esto, toda consulta que pase por
          # `enTenant` rompe con "falta DATABASE_URL_APP" — que en el pen test se
          # lee como "la pared entre inquilinos falló" y no como "falta una variable".
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
          GMAIL_TENANT_ID: ${{ secrets.GMAIL_TENANT_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}

      - name: Qué significa que esto falle
        if: failure()
        run: |
          echo "::error::Un mensaje que llega por el transporte real no termina en un caso."
          echo ""
          echo "  · 'no pudo dejar el mensaje' → la casilla se desconectó, o el token"
          echo "                                  de Gmail dejó de servir."
          echo "  · 'no se creó el caso'       → el poller o el webhook lo levantan y"
          echo "                                  algo se rompe antes del worker."
          echo "  · 'la respuesta SALIÓ'       → el freno de destinatarios reservados"
          echo "                                  no frenó. Eso es un mail a alguien."
          echo ""
          echo "Reproducilo con: pnpm knock --keep"

  # ── La prueba de carga, sólo la mitad gratis ─────────────────────────────────
  #
  # La fase de lectura: las consultas del tablero contra la base de producción,
  # con 1, 5 y 20 analistas simultáneos, y el plan que Postgres elige para cada
  # una. No escribe nada y no gasta un token.
  #
  # Lo que busca no es una latencia bonita: es la regresión silenciosa. Un
  # cambio de orden o un filtro nuevo pueden dejar el índice afuera y convertir
  # el listado en un recorrido de la tabla entera. Con cuatrocientos casos eso
  # no se nota; con cuatrocientos mil es la pantalla que no abre, y para
  # entonces nadie se acuerda del commit que lo causó.
  #
  # La fase de escritura — cien asegurados a la vez contra el webhook — NO corre
  # acá: cuesta plata en cada deploy y el número no cambia solo. Se corre a
  # mano antes de un piloto, con `pnpm load --write --claimants 100`.
  #
  # De las cuatro formas de lectura corre UNA, la de carga, que es la que
  # contesta la pregunta de un deploy: ¿esto quedó más lento que ayer? Las otras
  # tres (pico, resistencia, estrés) tienen sentido a mano y no en cada deploy:
  # miden minutos contra la base de producción para contestar preguntas que no
  # cambian de un commit al otro. `pnpm load --forma todas`.
  #
  # El reporte se guarda como artefacto porque, cuando esto falla, el mensaje de
  # abajo pide compararlo con la corrida anterior — y hasta ahora esa corrida no
  # quedaba en ningún lado.
  # ── Y por qué espera a los otros dos ────────────────────────────────────────
  #
  # Esto mide p95 con 1, 5 y 20 analistas simultáneos contra la base de
  # producción. El ensayo y el timbre entran a ESA misma base al mismo tiempo:
  # el ensayo abre trece conversaciones enteras con extracción incluida, y el
  # timbre crea casos y consulta en bucle. Con todos arrancando juntos, este
  # job no medía las consultas del tablero — medía a sus hermanos.
  #
  # Pasó el 2026-09-08, dos corridas seguidas con la MISMA cantidad de filas:
  #
  #     56b5ff4   486 casos   p95 peor caso 435 ms   ✓
  #     5f0bba5   484 casos   p95 peor caso 835 ms   ✗
  #
  # Las columnas de 1 y 5 simultáneos casi no se movieron; sólo se duplicó la
  # de 20, que es justo donde la contención se nota. Ninguna consulta cambió
  # entre esos dos commits.
  #
  # Es el mismo error que ya se arregló en `ci.yml` entre los tests de
  # integración y los e2e, y entre corridas: un número que depende de qué más
  # está corriendo no es un presupuesto, es un sorteo. Y un rojo que sale por
  # sorteo se deja de mirar.
  #
  # `always()` porque esto es orden y no dependencia: si alguno falla, la
  # medición tiene que correr igual — de hecho ahí interesa más.
  #
  # La primera versión de esto esperaba sólo al ensayo y al timbre, y quedó
  # corta: el pen test también entra a la misma base —le pega a los endpoints
  # de producción, y cada uno consulta— y seguía corriendo al mismo tiempo. La
  # corrida de `fe1d0b8` volvió a pasarse del presupuesto con `búsqueda por
  # texto` en 611 ms mientras el pen test estaba encima.
  #
  # La regla, entonces, es la simple: esta medición va ÚLTIMA. Si mañana
  # aparece otro job que toque la base, va en esta lista.
  #
  # ── Y por qué QA no la mide ─────────────────────────────────────────────────
  #
  # `medir_carga` lo apaga el caller. QA va a tener cuatrocientos casos contra
  # los cientos de miles de producción, y un p95 medido ahí no compara con el
  # presupuesto de esta medición: no dice si el deploy quedó más lento, dice
  # que la tabla es chica. Un rojo así se deja de mirar, igual que el del
  # sorteo de arriba.
  carga:
    name: Carga de lectura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [smoke, rehearse, timbre, pentest, permisos]
    if: always() && needs.smoke.result == 'success' && inputs.medir_carga
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Secreto de sesión propio de la corrida: ver el ensayo.
      - name: Medir las consultas del tablero
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          pnpm load --reporte carga.json
        env:
          # Ídem: default a dev en scripts/load-test.mts.
          SMOKE_URL: ${{ inputs.url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # La capa de datos entra por acá. Sin esto, toda consulta que pase por
          # `enTenant` rompe con "falta DATABASE_URL_APP" — que en el pen test se
          # lee como "la pared entre inquilinos falló" y no como "falta una variable".
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
          GMAIL_TENANT_ID: ${{ secrets.GMAIL_TENANT_ID }}

      # `always()`: el reporte del deploy que FALLÓ es justamente el que hay que
      # poder mirar.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: carga
          path: |
            carga.json
            carga.html
          if-no-files-found: warn
          retention-days: 30

      - name: Qué significa que esto falle
        if: failure()
        run: |
          echo "::error::El tablero se puso lento, o una consulta perdió su índice."
          echo ""
          echo "  · 'regresión' en el plan del listado → el listado dejó de usar el índice."
          echo "                             Mirá qué cambió en el orden o los filtros"
          echo "                             de listCases (src/server/cases/list.ts)."
          echo "  · 'cuellos del tablero' en el plan → Postgres aplanó el lateral en un"
          echo "                             Hash Join (falta la valla offset 0 de"
          echo "                             consultaDeCuellos, src/server/metrics/trayecto.ts)"
          echo "                             o no entra por target_id (falta el índice"
          echo "                             idx_audit_log_trayecto, migración 0043)."
          echo "  · 'acumulador mensual de IA' → difiere de ai_usage, o dice NO SE PUDO"
          echo "                             COMPROBAR: la migración 0046 no está aplicada en"
          echo "                             esta base, o el trigger se deshabilitó, o ai_usage"
          echo "                             se truncó. Se recompone volviendo a aplicar la"
          echo "                             0046 entera, no su backfill suelto: node"
          echo "                             scripts/migrate.mjs --env VAR --forget 0046 --apply"
          echo "                             y después --apply (ver la cabecera de la 0046)."
          echo "  · p95 por encima del presupuesto → puede ser volumen real."
          echo "                             Comparalo con el artefacto 'carga' del deploy"
          echo "                             anterior: carga.json tiene los números medidos"
          echo "                             y carga.html los muestra."
          echo ""
          echo "Reproducilo con: pnpm load"

  # ── El pen test, la mitad gratis ─────────────────────────────────────────────
  #
  # Corre desde donde corre un desconocido: sin credenciales. Prueba cada ruta
  # de la API —la lista sale de recorrer src/app/api, no está escrita a mano—
  # más las firmas de webhook, las cabeceras, CORS y lo que cuenta un error.
  #
  # El valor está en que la lista no sea manual: una ruta nueva que nadie
  # protegió falla acá el día que se sube. Escrita a mano, la lista se
  # desactualiza el primer día que alguien tiene apuro.
  #
  # Los ataques al agente (--agent) gastan tokens del mismo cupo que atiende a
  # los asegurados, así que en producción NO corren: el primer paso del job lo
  # rechaza. En QA sí (`atacar_agente`), con su cupo y su base. Contra
  # producción se corren a mano al tocar el agente o los prompts, con
  # `pnpm pentest --agent`.
  # ── Migraciones y permisos del rol ───────────────────────────────────────────
  #
  # Tres preguntas a la base, en un solo runner: las tres instalan lo mismo y
  # tardan menos que la instalación. Cada paso corre aunque el anterior falle,
  # así el rojo dice cuál de las tres no se cumple.
  #
  # Migraciones: una del repo sin fila en `schema_migrations` de ESTA base es
  # código nuevo que ya la espera, y el síntoma sería un 42703 a mitad de un
  # pedido. `pnpm esquemas` —archivos de migración contra esquema— NO está acá:
  # necesita `STAGING_DATABASE_URL`, y sin staging al día se pondría rojo por
  # drift de staging, no de producción. Se corre a mano.
  #
  # Permisos: la aplicación ya no consulta con el rol dueño de las tablas: usa
  # `claimmix_app`, que obedece RLS. Un GRANT que falte no se ve como un error
  # visible — casi todas las escrituras están adentro de un `try/catch` que
  # traga el fallo a propósito, así que el síntoma es una aplicación que anda y
  # no guarda nada.
  #
  # Sólo lee.
  permisos:
    name: Migraciones y permisos del rol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar dependencias
        id: deps
        run: pnpm install --frozen-lockfile

      # `secrets.DATABASE_URL` ya es la base de cada caller (producción por
      # `inherit`, QA por `QA_DATABASE_URL` en post-deploy.yml). El nombre no es
      # `DATABASE_URL` por lo mismo que en ci.yml: `migrate.mjs` no pasa por
      # `enTenant`. Con `--exigir-al-dia` sólo lee.
      - name: Migraciones aplicadas
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node scripts/migrate.mjs --url "$BASE_A_MIRAR" --exigir-al-dia
        env:
          BASE_A_MIRAR: ${{ secrets.DATABASE_URL }}

      - name: Preguntarle al catálogo qué puede hacer el rol
        id: rol
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm permisos
        env:
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}

      # Las migraciones de QA y de producción se aplican a mano y sin registro:
      # un `ALTER ROLE … BYPASSRLS` o una tabla con `tenant_id` sin cobertura
      # no lo vería nadie. `permisos` mira los GRANT; esto mira que el rol siga
      # obedeciendo RLS. Sólo lee.
      - name: Preguntarle a la base si separa a las aseguradoras
        id: tenancy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm tenancy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}

      - name: Qué significa que esto falle
        if: failure() && (steps.rol.outcome == 'failure' || steps.tenancy.outcome == 'failure')
        run: |
          echo "::error::El rol de la aplicación no tiene lo que la capa de datos le pide."
          echo ""
          echo "  · 'le falta INSERT'   → una tabla nueva nació sin permisos. Los"
          echo "                          ALTER DEFAULT PRIVILEGES cubren las que se"
          echo "                          crean después; una migración que las crea"
          echo "                          con otro rol dueño se saltea eso."
          echo "  · 'sin forzar'        → le falta FORCE ROW LEVEL SECURITY. Sin él,"
          echo "                          el dueño de la tabla ignora sus propias"
          echo "                          políticas."
          echo "  · 'sin ninguna'       → tabla con RLS y sin política: no filtra,"
          echo "                          niega todo. Se ve como una tabla vacía."
          echo "  · 'BYPASSRLS' o       → alguien le dio al rol de la aplicación un"
          echo "    'SUPERUSER'           atributo que ignora toda política. Las"
          echo "                          migraciones no lo muestran: se corrige en la"
          echo "                          base con ALTER ROLE … NOBYPASSRLS."
          echo "  · 'sin RLS' o         → una tabla con tenant_id quedó sin cobertura:"
          echo "    'sin política'        un inquilino la vería entera."
          echo ""
          echo "Reproducilo con: pnpm permisos && pnpm tenancy"

  pentest:
    name: Pen test del deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Después del ensayo: el ataque al agente deja casos en el bloque reservado
    # de teléfonos, y el ensayo barre ese bloque al arrancar.
    needs: [smoke, rehearse]
    # Lo apaga su caller y el job `alcance` lo nombra como no verificado.
    #
    # `!cancelled()` porque esto es orden y no dependencia: si el ensayo falla
    # o no corre, el pen test tiene que correr igual. Lo que sí se exige es el
    # smoke, como antes.
    if: ${{ !cancelled() && inputs.correr_pentest && needs.smoke.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # La lista de hosts vetados vive en el repositorio, así que el checkout va
      # primero. No recibe ningún secreto ni corre nada de la URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `--agent` gasta tokens y escribe casos; `--pared-propia` escribe un
      # inquilino. Ninguno de los dos va contra dev ni contra prd, venga de donde
      # venga el pedido. El guion rechaza el segundo por su cuenta; el primero no
      # mira la URL, así que el freno está acá. Si la URL no se lee, también
      # frena: `--veto` sale con 1 ante la duda.
      - name: ¿Se escribe donde no se debe?
        env:
          URL: ${{ inputs.url }}
          ATACAR_AGENTE: ${{ inputs.atacar_agente }}
          PARED_PROPIA: ${{ inputs.pared_propia }}
          PRD_URL: ${{ vars.PRD_URL }}
        run: |
          if { [ "$ATACAR_AGENTE" = "true" ] || [ "$PARED_PROPIA" = "true" ]; } && ! node scripts/lib/hosts-vetados.mjs --veto "$URL"; then
            echo "::error::atacar_agente y pared_propia escriben casos: no corren contra producción."
            exit 1
          fi

      # Los ataques al agente llaman al modelo desde el runner, igual que el
      # ensayo: misma identidad, por Workload Identity Federation.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: inputs.atacar_agente
        with:
          project_id: claimmix-506321
          workload_identity_provider: projects/1032332436198/locations/global/workloadIdentityPools/vercel/providers/github
          service_account: claimmix-extractor@claimmix-506321.iam.gserviceaccount.com

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Secreto de sesión propio de la corrida: ver el ensayo.
      - name: Atacar la superficie y la pared entre tenants
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$BETTER_AUTH_SECRET"
          pnpm pentest $PARED_PROPIA $AGENTE
        env:
          # Contra la URL del caller. Sin esto ataca la de dev por
          # default (scripts/pen-test.mts), corra quien corra.
          SMOKE_URL: ${{ inputs.url }}
          PARED_PROPIA: ${{ inputs.pared_propia && '--pared-propia' || '' }}
          AGENTE: ${{ inputs.atacar_agente && '--agent' || '' }}
          # La fase de la pared necesita la base y DOS tenants. Sin el segundo
          # el guion falla y lo dice: en producción es DEMO_TENANT_ID, en QA lo
          # arma `--pared-propia` y DEMO_TENANT_ID tiene que estar vacío.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # La capa de datos entra por acá. Sin esto, toda consulta que pase por
          # `enTenant` rompe con "falta DATABASE_URL_APP" — que en el pen test se
          # lee como "la pared entre inquilinos falló" y no como "falta una variable".
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
          GMAIL_TENANT_ID: ${{ secrets.GMAIL_TENANT_ID }}
          DEMO_TENANT_ID: ${{ secrets.DEMO_TENANT_ID }}
          # Sólo los usa `--agent`: el modelo y el cupo de tokens que lee el
          # runner, como en el ensayo.
          GEMINI_TRANSPORT: ${{ secrets.GEMINI_TRANSPORT }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          AI_TENANT_DAILY_TOKEN_CAP: ${{ vars.AI_TENANT_DAILY_TOKEN_CAP || '20000000' }}
          AI_ANONIMO_DAILY_TOKEN_CAP: ${{ vars.AI_ANONIMO_DAILY_TOKEN_CAP }}

      - name: Qué significa que esto falle
        if: failure()
        run: |
          echo "::error::Hay algo accesible sin credenciales."
          echo ""
          echo "  · una ruta 'abierta'  → le falta requireRole o el chequeo de sesión."
          echo "                          Si es pública a propósito, agregala a"
          echo "                          INTENTIONALLY_PUBLIC en scripts/pen-test.mts"
          echo "                          CON EL MOTIVO, y controlá qué contesta."
          echo "  · una cabecera        → mirá next.config.ts y src/proxy.ts."
          echo "  · 'cruza la pared'    → UNA CONSULTA SIN where tenant_id."
          echo "                          Es la falla que termina el negocio. Parate acá."
          echo "  · 'quedó sin borrar'  → la limpieza de --pared-propia falló. Borrá a mano"
          echo "                          el inquilino, el caso y el cliente con los ids"
          echo "                          que imprimió."
          echo ""
          echo "Reproducilo con: pnpm pentest"

  # ── El alcance: qué se preguntó de verdad ───────────────────────────
  #
  # Un caller puede apagar los chequeos que su entorno no puede correr. Eso está
  # bien. Lo que no puede pasar es que se apaguen EN SILENCIO: cuatro jobs verdes
  # de los que tres ni arrancaron se leen igual que siete chequeos pasados, y de
  # ahí venía el verde por ausencia.
  #
  # Este job corre siempre, aun con todo rojo, y escribe una fila por chequeo en
  # el resumen del run: si corrió, si falló, o si NO corrió y por qué. No vuelve
  # a fallar por lo que ya falló arriba — ese rojo ya está en su propio job — y
  # tampoco lo tapa.
  alcance:
    name: Resumen de chequeos
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [smoke, rehearse, timbre, carga, permisos, pentest]
    if: always()
    steps:
      - name: Escribir el alcance en el resumen
        env:
          ENTORNO: ${{ inputs.entorno }}
          URL: ${{ inputs.url }}
          ATACAR_AGENTE: ${{ inputs.atacar_agente }}
          SMOKE: ${{ needs.smoke.result }}
          ENSAYO: ${{ needs.rehearse.result }}
          TIMBRE: ${{ needs.timbre.result }}
          CARGA: ${{ needs.carga.result }}
          PERMISOS: ${{ needs.permisos.result }}
          PENTEST: ${{ needs.pentest.result }}
          PROFUNDO: ${{ inputs.smoke_profundo }}
          TOLERA: ${{ inputs.smoke_tolera }}
        run: |
          # $1 nombre, $2 resultado, $3 el interruptor que lo apaga (o "-").
          # "propio" es el smoke, que no cuelga de nadie.
          fila() {
            case "$2" in
              success)   estado="corrió y pasó" ;;
              failure)   estado="CORRIÓ Y FALLÓ" ;;
              cancelled) estado="cancelado: no dice nada" ;;
              *)
                if [ "$SMOKE" != "success" ] && [ "$3" != "propio" ]; then
                  estado="NO CORRIÓ: el smoke no pasó y todo lo demás cuelga de él"
                elif [ "$3" = "-" ]; then
                  estado="NO CORRIÓ: no tiene interruptor propio, mirá el grafo de jobs"
                else
                  estado="NO CORRIÓ: lo apagó el caller ($3)"
                fi
                ;;
            esac
            echo "| $1 | $estado |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "## Qué se le preguntó a $ENTORNO"
            echo ""
            echo "Contra $URL."
            echo ""
            echo "| Chequeo | Qué pasó |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          fila "Smoke del deploy" "$SMOKE" "propio"
          fila "Ensayo de conversaciones" "$ENSAYO" "correr_ensayo"
          fila "Canales de entrada (Gmail y WhatsApp)" "$TIMBRE" "correr_timbre"
          fila "Pen test (superficie y pared)" "$PENTEST" "correr_pentest"
          # Es el mismo job, pero con otro interruptor: si corrió sin `--agent`,
          # el resultado del pen test no dice nada del agente.
          if [ "$ATACAR_AGENTE" = "true" ]; then
            fila "Ataques al agente (pen test)" "$PENTEST" "correr_pentest"
          else
            fila "Ataques al agente (pen test)" "skipped" "atacar_agente"
          fi
          fila "Migraciones y permisos del rol" "$PERMISOS" "-"
          fila "Carga de lectura" "$CARGA" "medir_carga"
          {
            echo ""
            if [ "$PROFUNDO" = "true" ]; then
              echo "El smoke corrió profundo: subió un archivo a R2 y llamó al modelo de verdad."
            else
              echo "El smoke corrió liviano: NO se probaron ni el almacenamiento ni el modelo."
            fi
            if [ -n "$TOLERA" ]; then
              echo ""
              echo "Chequeos de salud que este entorno no configura, y que el smoke NO verificó: $TOLERA."
            fi
            echo ""
            echo "Lo que dice NO CORRIÓ no está probado. Un verde de este run no lo cubre."
          } >> "$GITHUB_STEP_SUMMARY"
