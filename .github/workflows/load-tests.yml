name: Carga

# ── Qué corre solo y qué se pide a mano ─────────────────────────────────────
#
# Cuando Vercel termina una vista previa, corre el SMOKE contra ella: un VU,
# treinta segundos. Alcanza para lo que se rompe de verdad —una ruta que se
# renombró, un login que cambió de forma— y no gasta nada.
#
# Los perfiles pesados van a mano, y contra donde diga quien los lanza.
#
# NO hay soak semanal, y es una decisión, no un olvido: dos horas a 30 VUs
# sondeando cada cinco segundos son unas cuarenta y tres mil invocaciones, casi
# la mitad de la cuota mensual del plan Hobby. Un perfil de resistencia contra
# el deploy real de este proyecto no mide resistencia: mide el plan. Cuando haga
# falta, se lanza a mano contra una vista previa.
#
# Ver también `tests/load/config/base.js`, que se niega a correr un perfil
# pesado fuera de localhost salvo que se lo pida explícitamente.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      escenario:
        description: "Cuál correr"
        required: true
        default: smoke
        type: choice
        options: [smoke, load, stress, spike, soak, peak]
      base_url:
        description: "Contra qué URL"
        required: true
        type: string
      permitir_remoto:
        description: "Dejar que un perfil pesado apunte fuera de localhost"
        required: false
        default: false
        type: boolean

# Sólo leer. Este trabajo maneja credenciales de una cuenta real; no tiene por
# qué poder escribir nada. El default del repo es `read` hoy, pero eso es un
# ajuste a un clic de distancia de ser `write`.
permissions:
  contents: read

concurrency:
  group: carga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carga:
    name: k6
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # El evento `deployment_status` llega también para estados intermedios y
    # para producción. Acá interesan las vistas previas que terminaron bien y
    # el proyecto de QA: contra la producción de los clientes esto no corre
    # solo nunca.
    #
    # QA entra por el `endsWith`, y hace falta porque su deploy llega
    # etiquetado `Production – claimmix-qa` —GitHub le agrega el nombre del
    # proyecto cuando hay más de uno— y la exclusión de arriba lo sacaba junto
    # con producción. Medir ahí es lo que siempre se quiso: la cuenta de
    # pruebas vive en la rama `qa` de Neon, que es la que lee ese deploy, y no
    # existe en la base de producción.
    #
    # ⛔ `!= 'Production'` NO alcanza, y era peligroso. Cuando nació el segundo
    # proyecto de Vercel, GitHub pasó a llamar al entorno `Production – claimmix`
    # para desambiguarlo. Con la comparación exacta, un deploy de PRODUCCIÓN
    # dejaba de ser igual a `Production` y entraba acá: k6 midiendo carga contra
    # la base de los clientes. No llegó a pasar sólo porque falta el secreto de
    # Vercel y el job muere antes.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (!startsWith(github.event.deployment.environment, 'Production') ||
        endsWith(github.event.deployment.environment, '-qa')))

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Instalar k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Elegir escenario
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            echo "escenario=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "escenario=${{ inputs.escenario }}" >> "$GITHUB_OUTPUT"
          fi

      # ── A dónde se mandan las credenciales ─────────────────────────────────
      #
      # `target_url` lo pone quien crea el deployment, y el `if:` de arriba sólo
      # mira el ESTADO y el ENTORNO, no el host. Abajo, `helpers/auth.js` hace un
      # POST con el correo y la contraseña de la cuenta de pruebas a
      # `${BASE_URL}/api/auth/sign-in/email`.
      #
      # O sea que cualquiera que pueda crear un `deployment_status` en este repo
      # —un colaborador con escritura, o una integración con más permisos de los
      # que necesita— apunta la URL a un host suyo y se lleva una credencial viva.
      #
      # El host se comprueba antes de que la credencial exista en el entorno.
      - name: ¿A dónde apunta esto?
        id: destino
        env:
          # Contra QA va el ALIAS, no la URL del deploy. Medido el 18/09: la URL
          # con hash de ese proyecto está detrás de Vercel Auth —contesta
          # `{"protection":{"vercel_auth_enabled":true…}}` antes de llegar a la
          # aplicación— y el secreto de automatización que hay en el repositorio
          # es el del OTRO proyecto, así que ahí k6 mediría la puerta. El alias
          # de producción de QA es público, y además es la URL que usa quien
          # prueba.
          URL: >-
            ${{ inputs.base_url || (endsWith(github.event.deployment.environment, '-qa')
            && 'https://claimmix-qa.vercel.app' || github.event.deployment_status.target_url) }}
        run: |
          # Se compara el HOST pelado, no la URL entera, y por eso hay tres
          # pasos y no un `case` solo.
          #
          # ⛔ El `case` contra la URL entera tenía un agujero: `*` en un patrón
          # de `case` casa también con `/`, con `?` y con `@`. Así,
          # `https://claimmix-x.evil.com/-ilandaniele-3471s-projects.vercel.app`
          # entraba por el tercer patrón —`claimmix-` + `*` + el sufijo— con el
          # host en `evil.com` y el sufijo de la organización degradado a una
          # ruta. Lo mismo con `?` en lugar de `/`. Es exactamente la amenaza
          # que describe el comentario de arriba, y estaba abierta.
          #
          # Primero el esquema: `http://` no entra, y sin eso el recorte de
          # abajo no recorta nada y todo el filtro corre contra otra cosa.
          case "$URL" in
            https://*) ;;
            *)
              echo "::error title=Destino no reconocido::$URL no es https. Se corta."
              exit 1 ;;
          esac

          # Después, lo que quede después de `https://` tiene que ser un host y
          # nada más: sin ruta, sin consulta, sin ancla, sin credenciales y sin
          # puerto. Con eso, el `*` del último patrón ya no puede saltar a otro
          # dominio.
          HOST="${URL#https://}"
          case "$HOST" in
            *[/?#@:]*)
              echo "::error title=Destino no reconocido::$URL trae ruta, consulta, credenciales o puerto. Acá va sólo el origen de un despliegue de este proyecto. Se corta."
              exit 1 ;;
          esac

          # Y recién ahí la lista blanca.
          #
          # El alias de QA va LITERAL, no como comodín. Sus vistas previas ya
          # entran por el patrón de abajo —empiezan con `claimmix-`—; lo que
          # faltaba era el alias de producción de ese proyecto, que no lleva el
          # sufijo de la organización.
          # El sufijo de la organización, no sólo el nombre del proyecto: con
          # `claimmix*` alcanzaba con crear un proyecto llamado `claimmix-x` en
          # cualquier cuenta de Vercel para quedar del lado bueno del filtro.
          case "$HOST" in
            claimmix.vercel.app|claimmix-qa.vercel.app|claimmix-*-ilandaniele-3471s-projects.vercel.app)
              echo "url=$URL" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error title=Destino no reconocido::La corrida iba a mandar las credenciales de la cuenta de pruebas a $URL, que no es un despliegue de este proyecto. Se corta."
              exit 1 ;;
          esac

      # ── La puerta de Vercel ────────────────────────────────────────────────
      #
      # Las vistas previas están detrás de Deployment Protection: contestan 401
      # con `{"error":{"message":"Protected deployment"}}` ANTES de que el pedido
      # llegue a Next. Medir contra eso mide la puerta.
      #
      # Vercel da un secreto de automatización para pasar. Hay que crearlo en el
      # proyecto (Settings → Deployment Protection → Protection Bypass for
      # Automation) y ponerlo acá como `VERCEL_AUTOMATION_BYPASS_SECRET`.
      #
      # Mientras no esté, esto NO corre y lo dice. No sale verde —un verde que no
      # midió es peor que un rojo. Se avisa (no se falla) sólo cuando la corrida
      # viene de un fork, que por diseño no recibe secretos; en cualquier otro
      # caso falta el secreto porque nadie lo creó, y eso tiene que ser rojo.
      #
      # El secreto ya existe en el repo desde el 17/09. Acá decía que no, y que
      # por eso este job salía en rojo en cada corrida; las dos cosas dejaron de
      # ser ciertas y la nota se quedó.
      #
      # Acá decía que también faltaban `LOAD_TEST_EMAIL` y `LOAD_TEST_PASSWORD`.
      # Era falso, y lo desmiente este mismo archivo treinta líneas más abajo:
      # no son secretos, son variables que el job arma desde
      # `PLAYWRIGHT_TEST_EMAIL` y `PLAYWRIGHT_TEST_PASSWORD`.
      #
      # Falta UN secreto acá. Lo que sigue faltando después no es un secreto: la
      # cuenta de Playwright vive en la base de ENSAYO, y los únicos destinos que
      # acepta el paso de abajo leen la de PRODUCCIÓN, así que el login de
      # `setup()` va a dar 401 igual. Las tres salidas están en docs/PROMOCION.md,
      # paso 5.
      - name: ¿Hay llave para la vista previa?
        id: llave
        env:
          HAY: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ES_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$HAY" ]; then
            echo "hay=1" >> "$GITHUB_OUTPUT"
          elif [ "$ES_FORK" = "true" ]; then
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=Carga sin medir::Fork sin secretos, no se probó."
          else
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo "::error title=Carga sin medir::Falta VERCEL_AUTOMATION_BYPASS_SECRET. La vista previa está protegida y k6 mediría la pantalla de Vercel, no la aplicación. Creá el secreto en Vercel (Settings → Deployment Protection → Protection Bypass for Automation) y agregalo en GitHub."
            exit 1
          fi

      - name: Correr ${{ steps.plan.outputs.escenario }}
        if: steps.llave.outputs.hay == '1'
        run: |
          mkdir -p resultados
          k6 run "tests/load/scenarios/${{ steps.plan.outputs.escenario }}.js"
        env:
          BASE_URL: ${{ steps.destino.outputs.url }}
          # La vista previa no es localhost, así que un perfil pesado pide
          # permiso explícito. El smoke del deploy no lo necesita.
          PERMITIR_REMOTO: ${{ inputs.permitir_remoto && '1' || '0' }}
          # La misma cuenta de pruebas que usa Playwright. UNA sesión para todos
          # los VUs: el login tiene tope de cinco intentos cada diez segundos y
          # doscientos VUs logueándose miden ese tope. Ver `helpers/auth.js`.
          LOAD_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          LOAD_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # ── Cuando el login se cae, preguntar qué más está caído ───────────────
      #
      # Un 500 en el login puede ser del login o de todo el deploy, y son dos
      # problemas distintos. Estas tres rutas lo separan sin mandar credenciales:
      # `/` y `/login` no piden sesión, y `/api/health` contesta 401 cuando la
      # aplicación está viva. Si las tres se caen, lo que falla es el arranque
      # —`instrumentation.ts` corta el proceso sin `BETTER_AUTH_SECRET`, por
      # ejemplo—; si sólo se cae el login, el problema está en Better Auth o en su
      # base.
      #
      # Sólo corre cuando el paso de arriba falló, y sólo imprime códigos.
      - name: ¿Qué contesta el resto del deploy?
        if: failure() && steps.llave.outputs.hay == '1'
        env:
          URL: ${{ steps.destino.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # `/privacy` y `/demo` están en la lista porque son las dos únicas
          # rutas de página que NO consultan la sesión: son públicas y no están
          # en `SOLO_ANONIMOS`, así que el middleware las deja pasar sin tocar
          # la base (`src/proxy.ts`, pasos 4 y 5). `/` y `/login` sí la
          # consultan. Si estas dos contestan 200 y esas dos 500, el que no
          # contesta es la capa de datos y no queda nada más que mirar.
          # `/api/admin/health` es el único que dice POR QUÉ: es público —está
          # en `PUBLIC_PREFIXES`— y su `dbError` trae el código de Postgres o
          # los primeros 50 caracteres del mensaje. Eso separa «la variable no
          # está» de «la variable está y la base no contesta», que es lo último
          # que queda por saber y no se puede mirar desde afuera.
          for RUTA in / /login /privacy /demo /api/health /api/admin/health; do
            CUERPO=$(curl -s -D - -o cuerpo.txt -H "x-vercel-protection-bypass: $BYPASS" "$URL$RUTA")
            COD=$(printf '%s' "$CUERPO" | head -1)
            # `x-vercel-error` es lo que separa un fallo de la plataforma
            # —FUNCTION_INVOCATION_FAILED, DEPLOYMENT_NOT_FOUND— de un 500 que
            # devolvió la aplicación con su propia página de error.
            ERR=$(printf '%s' "$CUERPO" | grep -i '^x-vercel-error:' || true)
            echo "$RUTA -> $COD ${ERR:-sin x-vercel-error}"
            head -c 200 cuerpo.txt | tr '\n' ' '
            echo
          done

      # Y una vez que se sabe que el 500 es de la aplicación y no de la
      # plataforma, falta cuál de las dependencias es la que no contesta.
      #
      # `/api/health` es el único que lo dice desde ADENTRO del deploy: corre
      # con las variables de ESE entorno y reporta, dependencia por
      # dependencia, qué alcanza. Sin esto el diagnóstico se queda en «algo
      # tira 500» y hay que adivinar cuál de las once variables falta.
      #
      # Sale el nombre, el estado y el detalle recortado de cada chequeo. No
      # son secretos: es el mapa de qué está configurado, que es justamente lo
      # que el `Bearer CRON_SECRET` protege de los de afuera.
      - name: ¿Qué dependencia del deploy no contesta?
        if: failure() && steps.llave.outputs.hay == '1'
        env:
          URL: ${{ steps.destino.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "Sin CRON_SECRET del repositorio no se puede interrogar a /api/health."
            exit 0
          fi
          COD=$(curl -s -o salud.json -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $BYPASS" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL/api/health")
          echo "/api/health -> $COD"
          if jq -e . salud.json > /dev/null 2>&1; then
            jq -r '"entorno=" + (.environment // "?") + " commit=" + (.commit // "?") + " estado=" + (.status // "?")' salud.json
            jq -r '.checks[]? | "  " + .name + ": " + .status + " — " + (.detail // "" | .[0:120])' salud.json
          else
            head -c 300 salud.json
            echo
          fi

      # `always()`: el reporte de la corrida que FALLÓ es el que hay que mirar.
      - name: Guardar el reporte
        if: always() && steps.llave.outputs.hay == '1' 
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carga-${{ steps.plan.outputs.escenario }}
          path: resultados/
          retention-days: 30
