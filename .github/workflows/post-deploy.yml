# Comprobar el deploy que acaba de salir, en el entorno donde salió.
#
# Un solo archivo para DEV (proyecto claimmix), QA (claimmix-qa) y PRD
# (claimmix-prd): la llave de Vertex (WIF) confía en el nombre de este archivo,
# así que no se parte ni se renombra. Cada job lleva el entorno adelante, y el
# título de la corrida también.
#
# Qué pregunta cada uno de los seis chequeos, y por qué, vive en
# deploy-checks.yml. Este archivo sólo decide CUÁNDO llamarlo, y contra cuál.

name: Post-deploy · DEV, QA y PRD
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('DEV · a mano · {0}', github.sha)
  || github.event.deployment_status.state != 'success' && format('Sin chequeos · Vercel avisó {0} · {1}', github.event.deployment_status.state, github.event.deployment.environment)
  || !startsWith(github.event.deployment.environment, 'Production') && format('Vista previa · sin chequeos · {0}', github.event.deployment.sha)
  || endsWith(github.event.deployment.environment, '-qa') && format('QA · deploy {0}', github.event.deployment.sha)
  || endsWith(github.event.deployment.environment, '-prd') && format('PRD · deploy {0}', github.event.deployment.sha)
  || format('DEV · deploy {0}', github.event.deployment.sha) }}

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "URL a chequear"
        default: "https://claimmix-dev.vercel.app"
        required: false
      ensayar:
        description: "Correr el ensayo de conversaciones (25 a 37 minutos)"
        type: boolean
        default: true

# Una corrida por vez, y sin cancelar la que está andando.
#
# Estos trabajos no corren contra un runner limpio: corren contra la base de
# DEV, con datos reales, y algunos crean casos y los borran al terminar. Dos corridas
# superpuestas se pisan los casos entre sí, y el que pierde reporta que su
# caso no se creó — un rojo que no dice nada sobre el deploy.
#
# `cancel-in-progress: false` y no `true`: cortar una corrida a la mitad deja
# casos de prueba sin limpiar en la base de un cliente. Que espere.
#
# El grupo es una constante, no la rama ni el commit: lo que hay que serializar
# no son los deploys, es el acceso a esa base.
#
# ── Pero la cola es sólo de producción, y esto costó una corrida ─────────────
#
# `deployment_status` llega también por cada preview y por cada estado
# intermedio. Esas corridas saltean todo —el job `dev` tiene la
# guarda— y terminan en `skipped`. Parecen gratis. No lo son: **ya reservaron
# el turno**.
#
# Con `cancel-in-progress: false` GitHub guarda UNA sola corrida esperando.
# Cuando llega otra, la que estaba en la cola se cancela. El 10/09, con una
# corrida andando, pasó esto:
#
#     16:26:25  886336c  Production  ← el merge a main, encolado
#     16:27:58  5dbf546  Preview     ← se crea el run de una rama
#     16:27:59  886336c  cancelled   ← un segundo después, sin un job arrancado
#
# El post-deploy del merge nunca corrió, y no dejó un rojo: dice `cancelled`,
# que se lee como que alguien la cortó a propósito. Una corrida que no ejecuta
# nada puede tapar la única comprobación que mira producción de verdad.
#
# Así que entra a la cola lo mismo que pasa la guarda de `dev`. Todo lo
# demás va a un grupo propio —uno por corrida— donde no espera ni echa a
# nadie. La condición está repetida a propósito: son dos lugares distintos de
# GitHub y no hay forma de compartirla.
#
# La condición también distingue el proyecto, no sólo el entorno: el deploy
# del proyecto de QA llega etiquetado igual —`Production` es el nombre de SU
# entorno, en SU proyecto— y sin distinguirlo entraría a esta misma cola y
# podría cancelar una corrida de producción de verdad que estuviera encolada.
#
# ⛔ Acá decía `deployment.ref == 'main'`, y por eso la cola estuvo MUERTA.
# Vercel le pone el SHA a `deployment.ref`, así que esa comparación no era
# cierta nunca: todo deploy de producción caía en el grupo `sin-cola`, uno por
# corrida, y dos post-deploy podían correr a la vez contra la base de un
# cliente pisándose los casos de ensayo. #199 arregló la guarda del job de
# abajo y se olvidó de esta copia —que es justo lo que advierte el comentario
# de arriba: son dos lugares distintos y hay que tocar los dos—.
#
# ── El proyecto se distingue por el NOMBRE del entorno, no por la URL ───────
#
# Acá hubo tres condiciones sobre `environment_url` —exigir que empezara con
# `https://claimmix`, excluir `https://claimmix-qa-` y excluir
# `https://claimmix-qa.`— y las tres eran inútiles. El primer deploy real de
# QA mostró que ese campo NO lleva el nombre del proyecto:
#
#     Production – claimmix     https://claimmix-nbjnatqfk-ilandaniele-3471s-projects.vercel.app
#     Production – claimmix-qa  https://claimmix-jerqmlxd5-ilandaniele-3471s-projects.vercel.app
#     Preview – claimmix        https://claimmix-ax2tnp71i-ilandaniele-3471s-projects.vercel.app
#
# Vercel arma ese host con el nombre del proyecto y un hash, y para los dos
# proyectos el nombre es el mismo prefijo: `claimmix-`. Ninguna URL de QA
# empieza con `https://claimmix-qa`, así que las dos exclusiones no podían
# casar nunca. No es teoría: la corrida 35352800702 corrió el job `produccion`
# para el deploy `c83b750` —que es de QA— y su smoke falló contra el alias de
# producción, que ese deploy no tocó.
#
# Lo que sí distingue a los dos proyectos es el NOMBRE del entorno. Cuando hay
# más de un proyecto, GitHub le agrega el nombre del proyecto para
# desambiguarlo: `Production – claimmix` y `Production – claimmix-qa`, con
# guion largo (U+2013). De ahí `endsWith(…, '-qa')`, que es el sufijo del
# nombre del proyecto en Vercel.
#
# Sigue siendo `startsWith(…, 'Production')` y no `== 'Production'`: la
# igualdad exacta dejó de ser cierta el día que nació el segundo proyecto.
#
# Con el tercero, producción de verdad (`claimmix-prd`), son tres nombres y
# cada job mira el suyo: QA termina en `-qa`, prd termina en `-prd` y dev es
# el que no termina en ninguno de los dos.
#
# Y sigue fallando CERRADA: si el nombre llegara vacío, `startsWith` es falso
# y no entra. Lo que se cae con un cambio de nombre del proyecto de QA es la
# exclusión, así que renombrarlo obliga a tocar estas dos copias de la
# condición — la de acá y la del `if` del job.
#
# ── Y QA tiene su propia cola, no la de producción ni la de nadie ──────────
#
# Desde que existe el job `qa`, un deploy de QA tampoco es gratis: corre el
# ensayo, que escribe y borra casos en la base de QA. Dos corridas de QA
# encimadas se pisan igual que dos de producción.
#
# Pero va a un grupo DISTINTO. Son dos bases distintas: hacer esperar a QA
# porque producción está midiendo no protege nada, y al revés tampoco — y con
# una sola cola compartida, el turno que QA reserva es el que le cancela la
# corrida encolada a producción, que es el defecto contado justo arriba.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.deployment_status.state == 'success' &&
    startsWith(github.event.deployment.environment, 'Production') &&
    !endsWith(github.event.deployment.environment, '-qa') &&
    !endsWith(github.event.deployment.environment, '-prd')))
    && 'post-deploy-dev'
    || (github.event.deployment_status.state == 'success' &&
    startsWith(github.event.deployment.environment, 'Production') &&
    endsWith(github.event.deployment.environment, '-qa'))
    && 'post-deploy-qa'
    || (github.event.deployment_status.state == 'success' &&
    startsWith(github.event.deployment.environment, 'Production') &&
    endsWith(github.event.deployment.environment, '-prd'))
    && 'post-deploy-prd'
    || format('post-deploy-sin-cola-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Un disparo a mano no elige adónde van los secretos ──────────────────────
  #
  # `dev` llama a deploy-checks.yml con los secretos de dev, uno por uno, y la
  # URL del disparo a mano llega hasta ahí. El reusable la vuelve a comprobar en
  # su primer paso, pero este job corta antes de que nada reciba un secreto:
  # sólo el alias de dev. El de QA ni el de prd tampoco entran: ese ensayo
  # correría con la base y el CRON_SECRET de dev contra un deploy que no es el
  # suyo (QA tiene su propio job, con sus secretos, y prd el suyo). Una vista
  # previa no entra, ni un host ajeno. Por deployment_status la URL es fija y el
  # job no corre. El disparo a mano corre sólo desde main: desde una rama
  # correría código sin revisar con los secretos de dev.
  validar_url:
    name: DEV · ¿El disparo a mano apunta a dev?
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: ¿A dónde apunta esto?
        env:
          URL: ${{ github.event.inputs.url || 'https://claimmix-dev.vercel.app' }}
          REF: ${{ github.ref }}
        run: |
          set -u
          if [ "$REF" != "refs/heads/main" ]; then echo "::error title=Disparo a mano::post-deploy.yml se dispara sólo desde main (--ref main): desde una rama correría código sin revisar con los secretos de dev"; exit 1; fi
          case "$URL" in
            https://*) ;;
            *) echo "::error::La URL tiene que empezar con https://"; exit 1 ;;
          esac
          HOST="${URL#https://}"
          case "$HOST" in
            *[/?#@:]*) echo "::error::La URL no puede llevar ruta, puerto, credenciales ni fragmento: ${HOST}"; exit 1 ;;
          esac
          case "$HOST" in
            claimmix-dev.vercel.app) ;;
            *) echo "::error::Este disparo sólo admite claimmix-dev.vercel.app, no ${HOST}"; exit 1 ;;
          esac

  # ── El ensayo de un árbol que QA ya ensayó no se repite ─────────────────────
  #
  # El ensayo son tres cuartos de los minutos de esta corrida, y corre en el
  # runner, no contra la URL: el mismo código, el mismo modelo y los mismos
  # escenarios; cambia sólo la base. Una promoción de `qa` a `main` arma el
  # mismo árbol que QA acaba de ensayar, así que repetirlo acá eran de 25 a 37
  # minutos para probar otra vez lo mismo.
  #
  # Cuando `qa_veredicto` publica verde deja un artefacto con el hash del
  # árbol, como `marcar` en ci.yml. Si este deploy arma ese árbol,
  # `dev` corre todo menos el ensayo; contra esta base lo vuelve a
  # correr el `pnpm check` completo de después de cada deploy. Cualquier error
  # cae del lado seguro: ensaya. El disparo a mano no pasa por acá: ensaya salvo
  # `ensayar=false`.
  ensayo_previo:
    name: DEV · ¿QA ya ensayó este árbol?
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      !endsWith(github.event.deployment.environment, '-qa') &&
      !endsWith(github.event.deployment.environment, '-prd')
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      correr: ${{ steps.buscar.outputs.correr }}
    steps:
      - name: Buscar la marca de QA
        id: buscar
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          correr=true
          arbol=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)
          if [ -n "$arbol" ]; then
            # Sólo cuenta una marca que dejó el post-deploy de un deploy de QA en verde:
            # cualquier paso de cualquier corrida puede subir un artefacto con cualquier nombre.
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ensayo-verde-$arbol&per_page=20" \
              --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID) | .workflow_run.id] | unique[]" 2>/dev/null || true)
            for id in $ids; do
              case "$id" in ''|*[!0-9]*) continue ;; esac
              origen=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
                --jq '[(.path | split("@")[0]), .event, .conclusion] | join(" ")' 2>/dev/null) || continue
              if [ "$origen" = ".github/workflows/post-deploy.yml deployment_status success" ]; then correr=false; break; fi
            done
          fi
          echo "correr=$correr" >> "$GITHUB_OUTPUT"
          if [ "$correr" = false ]; then
            echo "QA ya ensayó el árbol \`$arbol\` y pasó: el ensayo no se repite contra esta base." >> "$GITHUB_STEP_SUMMARY"
          fi

  dev:
    name: DEV
    needs: [validar_url, ensayo_previo]
    # El proyecto, no sólo el entorno: el deploy del proyecto de QA también
    # llega con un entorno que empieza con `Production` —así se llama SU
    # entorno de producción, en SU proyecto— y sin distinguirlo esto correría
    # el smoke de DEV contra el alias de dev para un deploy que
    # nunca lo tocó. Pasó, y está contado arriba con el número de corrida, en
    # el comentario de `concurrency`: ahí también está por qué la distinción
    # es el NOMBRE del entorno y no `environment_url`. Es la misma condición
    # que el grupo de `concurrency`, un piso más arriba, y las dos se tocan
    # juntas.
    #
    # ⛔ `deployment.ref` NO es el nombre de la rama: Vercel le pone el SHA.
    #
    # Se probó y el post-deploy quedó MUERTO — `f73a28b` desplegó a producción
    # con `state: success` y la corrida salió salteada, que es exactamente el
    # defecto que este trabajo vino a sacar: verde porque no corrió.
    #
    # Contra QA corre el job `qa`, acá abajo, con sus propios secretos y sus
    # propios interruptores. Lo que QA no puede correr queda nombrado en el
    # resumen del run por el job `alcance` de deploy-checks.yml.
    #
    # `validar_url` sólo corre en el disparo a mano, así que por
    # deployment_status queda `skipped` (y `ensayo_previo`, al revés): `!cancelled()` deja pasar eso y
    # `!= 'failure'` frena una URL rechazada. Sin la función de estado, un
    # `needs` salteado saltearía este job también.
    if: >
      !cancelled() && needs.validar_url.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' &&
        startsWith(github.event.deployment.environment, 'Production') &&
        !endsWith(github.event.deployment.environment, '-qa') &&
        !endsWith(github.event.deployment.environment, '-prd')))
    permissions:
      contents: read
      # Techo para el job `rehearse` de deploy-checks.yml: un workflow
      # reusable nunca obtiene más permiso que el de quien lo llama, así que
      # sin id-token acá ese job no podría pedir el token OIDC para WIF.
      id-token: write
    uses: ./.github/workflows/deploy-checks.yml
    with:
      # El `url` del disparo a mano llega hasta acá: si no, sería un campo
      # que se puede llenar y no hace nada.
      url: ${{ github.event.inputs.url || 'https://claimmix-dev.vercel.app' }}
      entorno: DEV
      medir_carga: true
      # `github.event.inputs`, no `inputs`: en un deploy `inputs.ensayar` es
      # null, y `null != false` da false — apagaría el ensayo de cada deploy.
      correr_ensayo: ${{ needs.ensayo_previo.outputs.correr != 'false' && github.event.inputs.ensayar != 'false' }}
    # Uno por uno, con su mismo nombre: con `inherit` también llegaban los de
    # QA y PRD. tests/unit/ci-secretos-del-reusable.test.ts frena uno que falte.
    secrets:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
      GMAIL_TENANT_ID: ${{ secrets.GMAIL_TENANT_ID }}
      GEMINI_TRANSPORT: ${{ secrets.GEMINI_TRANSPORT }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      DEMO_TENANT_ID: ${{ secrets.DEMO_TENANT_ID }}

  # ── QA: primero, que los secretos de QA sean de QA ──────────────────────────
  #
  # Cinco de los seis chequeos corren acá, en el runner, y hablan con la base
  # por `DATABASE_URL`. Tres de ellos ESCRIBEN. Por eso el job `qa` de abajo
  # mapea los secretos uno por uno en vez de heredarlos: heredando, una corrida
  # de QA crearía y borraría casos en la base de un cliente.
  #
  # Este job es el cinturón de ese mapeo, y hace dos cosas.
  #
  # Primero exige los cuatro secretos sin los cuales QA no puede correr NADA, y
  # falla en voz alta si falta alguno. La alternativa —que el caller mande el
  # secreto vacío y el job de abajo se rompa con el mensaje del script— también
  # sale roja, pero roja donde no se entiende: "falta DATABASE_URL" en un job
  # que sí la recibió, vacía.
  #
  # Y segundo, compara la cadena de QA con la de DEV sin que el runner reciba la
  # de DEV: la comparación se hace en la expresión (`${{ secrets.QA_X ==
  # secrets.X }}`) y al shell llega sólo `true` o `false`. Si son la misma,
  # alguien cargó la de DEV en el secreto de QA, y la próxima corrida de QA
  # escribe en la base de un cliente. Es el único error de esta familia que no
  # se ve en ningún lado hasta que ya pasó.
  #
  # El cuarto es el inquilino de QA (`QA_GMAIL_TENANT_ID`): el pen test deja ahí
  # su caso señuelo para atacar la pared, y sin él no hay pared que probar.
  #
  # Lo que NO es obligatorio se mira igual, y su ausencia apaga un chequeo en
  # vez de romper la corrida: el ensayo sube adjuntos de verdad y necesita
  # almacenamiento propio. Sin eso no corre, y el job `alcance` de
  # deploy-checks.yml lo nombra como no verificado y el veredicto de QA sale
  # rojo: un ensayo apagado no es un ensayo pasado.
  qa_secretos:
    name: QA · Secretos propios
    runs-on: ubuntu-slim
    timeout-minutes: 2
    # Misma condición que el grupo de `concurrency`, con el sufijo al revés.
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, '-qa')
    permissions:
      actions: read
      contents: read
    outputs:
      ensayo: ${{ steps.mirar.outputs.ensayo }}
      solo_docs: ${{ steps.docs.outputs.solo_docs }}
    steps:
      - name: Que estén, y que no sean los de DEV
        id: mirar
        env:
          BASE: ${{ secrets.QA_DATABASE_URL }}
          BASE_APP: ${{ secrets.QA_DATABASE_URL_APP }}
          CRON: ${{ secrets.QA_CRON_SECRET }}
          INQUILINO: ${{ secrets.QA_GMAIL_TENANT_ID }}
          R2_CUENTA: ${{ secrets.QA_R2_ACCOUNT_ID }}
          R2_LLAVE: ${{ secrets.QA_R2_ACCESS_KEY_ID }}
          R2_SECRETO: ${{ secrets.QA_R2_SECRET_ACCESS_KEY }}
          R2_BALDE: ${{ secrets.QA_R2_BUCKET }}
          MISMA_BASE: ${{ secrets.QA_DATABASE_URL == secrets.DATABASE_URL || secrets.QA_DATABASE_URL_APP == secrets.DATABASE_URL_APP }}
          MISMO_R2: ${{ (secrets.R2_BUCKET != '' && secrets.QA_R2_BUCKET == secrets.R2_BUCKET) || (secrets.R2_ACCESS_KEY_ID != '' && secrets.QA_R2_ACCESS_KEY_ID == secrets.R2_ACCESS_KEY_ID) }}
        run: |
          faltan=""
          [ -n "$BASE" ] || faltan="$faltan QA_DATABASE_URL"
          [ -n "$BASE_APP" ] || faltan="$faltan QA_DATABASE_URL_APP"
          [ -n "$CRON" ] || faltan="$faltan QA_CRON_SECRET"
          [ -n "$INQUILINO" ] || faltan="$faltan QA_GMAIL_TENANT_ID"
          if [ -n "$faltan" ]; then
            {
              echo "### Contra QA no corrió ningún chequeo"
              echo ""
              echo "Faltan secretos del repositorio:$faltan"
              echo ""
              echo "Cargá cada uno en Settings, Secrets and variables, Actions."
              echo "Los dos primeros son la rama de Neon de QA, NO la base de"
              echo "DEV, que tiene datos reales: el ensayo escribe y borra casos ahí adentro."
              echo "El tercero es el CRON_SECRET del proyecto claimmix-qa."
              echo "El cuarto es el inquilino de QA: el pen test arma ahí su señuelo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=QA sin secretos::Faltan$faltan - ver el resumen del run."
            exit 1
          fi
          # La comparación se hizo en la expresión: acá llega sólo true o false.
          if [ "$MISMA_BASE" != "false" ]; then
            {
              echo "### QA apunta a la base de DEV, que tiene datos reales"
              echo ""
              echo "QA_DATABASE_URL (o QA_DATABASE_URL_APP) es la misma cadena"
              echo "que el secreto de DEV. Si esto corriera, el ensayo"
              echo "escribiría y borraría casos en la base de un cliente."
              echo ""
              echo "Corregilo antes de volver a desplegar QA."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=QA apunta a DEV::Los secretos de QA son los de DEV."
            exit 1
          fi
          # Lo mismo para el almacenamiento: con el balde o la llave de DEV,
          # el ensayo sube y borra adjuntos de un cliente. La cuenta sí es la
          # misma a propósito, así que no se compara.
          if [ "$MISMO_R2" != "false" ]; then
            {
              echo "### QA apunta al balde de DEV, que tiene datos reales"
              echo ""
              echo "QA_R2_BUCKET (o QA_R2_ACCESS_KEY_ID) es el de DEV."
              echo "Si esto corriera, el ensayo subiría y borraría adjuntos"
              echo "en el balde de un cliente."
              echo ""
              echo "QA tiene el suyo: claimmix-qa-attachments, con su token."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=QA apunta al balde de DEV::Los secretos de R2 de QA son los de DEV."
            exit 1
          fi
          # El ensayo sube adjuntos de verdad, y desde el 20/09 QA tiene balde
          # propio para eso: claimmix-qa-attachments, con su propio token. Sin
          # los cuatro QA_R2_* no hay dónde subirlos y el ensayo no corre.
          if [ -n "$R2_CUENTA" ] && [ -n "$R2_LLAVE" ] &&
             [ -n "$R2_SECRETO" ] && [ -n "$R2_BALDE" ]; then
            echo "ensayo=1" >> "$GITHUB_OUTPUT"
          else
            echo "ensayo=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=QA sin ensayo::Faltan los QA_R2_* - el ensayo no corre."
          fi

      # Un merge a `qa` que sólo trae `.md` arma el mismo código que el commit
      # anterior. Si ese árbol ya tiene la marca de QA, el ensayo no se repite:
      # corre todo lo demás, como `ensayo_previo` en dev, y el veredicto deja la
      # marca para este árbol. Mismo filtro que `arbol` en ci.yml. Cualquier
      # error cae del lado seguro: ensaya.
      - name: ¿Sólo documentación sobre un árbol ensayado?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          solo_docs=false
          padre=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.parents[0].sha' 2>/dev/null || true)
          arbol_padre=""
          [ -z "$padre" ] || arbol_padre=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$padre" --jq .tree.sha 2>/dev/null || true)
          if [ -n "$arbol_padre" ]; then
            # Misma regla que «Buscar la marca de QA»: sólo la marca de un post-deploy de QA en verde.
            hay=0
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ensayo-verde-$arbol_padre&per_page=20" \
              --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID) | .workflow_run.id] | unique[]" 2>/dev/null || true)
            for id in $ids; do
              case "$id" in ''|*[!0-9]*) continue ;; esac
              origen=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[(.path | split("@")[0]), .event, .conclusion] | join(" ")' 2>/dev/null) || continue
              if [ "$origen" = ".github/workflows/post-deploy.yml deployment_status success" ]; then hay=1; break; fi
            done
            if [ "$hay" = 1 ]; then
              otros=$(gh api "repos/$GITHUB_REPOSITORY/compare/$padre...$SHA" --jq 'if (.files | type) != "array" or (.files | length) >= 300 then 1 else [.files[] | .filename, (.previous_filename // empty) | select((endswith(".md")
                    and . != "docs/PROMOCION.md"
                    and (startswith("entrenamiento/") | not)
                    ) | not)] | length end' 2>/dev/null || echo 1)
              if [ "$otros" = 0 ]; then solo_docs=true; fi
            fi
          fi
          echo "solo_docs=$solo_docs" >> "$GITHUB_OUTPUT"
          if [ "$solo_docs" = true ]; then
            echo "Sólo cambió documentación sobre un árbol que QA ya ensayó: el ensayo no se repite." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── QA: lo que sí puede correr ──────────────────────────────────────────────
  #
  # Corre el smoke, las dos comparaciones contra el catálogo, el pen test —con
  # la pared armada con un inquilino propio y los ataques al agente— y, cuando
  # QA tiene lo suyo, el ensayo. No corre el timbre (QA no lleva Gmail ni
  # WhatsApp: no le escribe a nadie, a propósito), ni la carga (cuatrocientos
  # casos contra los cientos de miles de producción no comparan con el mismo
  # presupuesto).
  #
  # El smoke va liviano: `--deep` sube un archivo a R2 y llama al modelo, y eso
  # no es lo que este run viene a probar. Hasta el 20/09 además toleraba
  # `almacenamiento`, porque el proyecto de QA no tenía R2 y el chequeo salía
  # rojo SIEMPRE por lo mismo. Ahora QA tiene balde propio
  # (`claimmix-qa-attachments`, misma cuenta de Cloudflare que producción pero
  # con un token que no alcanza al balde de los clientes, ni el de producción
  # al de QA), así que el chequeo liviano —que sólo mira que las cuatro
  # variables llegaron al deploy— contesta ok sin tolerar nada. Liviano igual
  # quiere decir que la subida no se ejerció.
  #
  # `whatsapp` y `gmail` no hace falta tolerarlos: sin configurar avisan, no
  # fallan.
  #
  # Nada de esto queda implícito: el job `alcance` escribe, al final del run,
  # una fila por chequeo con lo que pasó o el motivo por el que no corrió.
  qa:
    name: QA
    needs: [qa_secretos]
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, '-qa')
    permissions:
      contents: read
      # Techo para el ensayo y los ataques al agente, que piden el token OIDC de
      # WIF. Sin ellos no se usa, y un permiso que sobra no hace nada.
      id-token: write
    uses: ./.github/workflows/deploy-checks.yml
    with:
      url: https://claimmix-qa.vercel.app
      entorno: QA
      smoke_profundo: false
      correr_ensayo: ${{ needs.qa_secretos.outputs.ensayo == '1' && needs.qa_secretos.outputs.solo_docs != 'true' }}
      correr_timbre: false
      correr_pentest: true
      pared_propia: true
      atacar_agente: true
      medir_carga: false
    # Uno por uno y con el nombre de QA de cada lado. `secrets: inherit` acá
    # sería apuntar cinco chequeos a la base de DEV, que tiene datos reales;
    # está contado arriba, en `qa_secretos`, y también en deploy-checks.yml
    # donde se declaran.
    secrets:
      CRON_SECRET: ${{ secrets.QA_CRON_SECRET }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      DATABASE_URL_APP: ${{ secrets.QA_DATABASE_URL_APP }}
      GMAIL_TENANT_ID: ${{ secrets.QA_GMAIL_TENANT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.QA_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.QA_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.QA_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.QA_R2_BUCKET }}
      # GEMINI_TRANSPORT, GOOGLE_CLOUD_PROJECT y GOOGLE_CLOUD_LOCATION son
      # configuración, no credenciales: la identidad viene de WIF. Son los únicos
      # sin QA_, y tests/unit/ci-secretos-del-reusable.test.ts no deja sumar otro.
      GEMINI_TRANSPORT: ${{ secrets.GEMINI_TRANSPORT }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}

  # ── QA: el veredicto, publicado sobre el commit ─────────────────────────────
  #
  # Los jobs de arriba cuelgan de un `deployment_status`, y GitHub no los
  # asocia al commit que se desplegó: un run verde de QA no se ve desde el PR
  # ni desde la promoción a main. Este job lo vuelve un estado del commit,
  # `Post-deploy QA`, con el SHA del deploy.
  #
  # `always()` porque lo que más importa publicar es el rojo, y que `qa` se
  # saltee porque `qa_secretos` falló también lo es. Sólo da verde si las dos
  # cosas pasaron y el ensayo corrió: un QA que no corrió no es un QA que pasó,
  # y `qa` da success aunque el ensayo se haya apagado por falta de los QA_R2_*.
  #
  # El job NO se llama como el estado. Cada corrida, aun las que saltean todo
  # (los estados intermedios de Vercel y los previews), deja un check run con el
  # nombre del job sobre el mismo SHA, y un salteado cuenta como aprobado: la
  # promoción mostraría «Post-deploy QA» pasado antes de que QA corra. Con otro
  # nombre, el único «Post-deploy QA» es el estado que publica el paso de abajo.
  # Y el paso sale 1 cuando publica rojo, para que su propio check run no quede
  # verde junto a un estado rojo.
  #
  # Mismo piso de permisos que el resto: escribir estados y leer el commit
  # para la marca del árbol.
  qa_veredicto:
    name: QA · Veredicto sobre el commit
    needs: [qa_secretos, qa]
    if: >
      always() &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, '-qa')
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publicar el veredicto sobre el commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          SECRETOS: ${{ needs.qa_secretos.result }}
          QA: ${{ needs.qa.result }}
          ENSAYO: ${{ needs.qa_secretos.outputs.ensayo }}
          SOLO_DOCS: ${{ needs.qa_secretos.outputs.solo_docs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SECRETOS" = "success" ] && [ "$QA" = "success" ]; then
            if [ "$ENSAYO" = "1" ]; then
              estado=success
              descripcion="QA pasó todos sus chequeos"
              if [ "$SOLO_DOCS" = "true" ]; then
                descripcion="QA pasó; sólo docs, el ensayo es el del árbol anterior"
              fi
            else
              estado=failure
              descripcion="QA sin ensayo (faltan QA_R2_*)"
            fi
          else
            estado=failure
            descripcion="QA falló o no corrió (secretos: $SECRETOS, chequeos: $QA)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$estado" \
            -f context="Post-deploy QA" \
            -f description="$descripcion" \
            -f target_url="$RUN_URL"
          [ "$estado" = "success" ] || exit 1

      # La marca que lee `ensayo_previo`. Sólo llega acá con el veredicto
      # verde, que exige el ensayo corrido y pasado, o heredado de un árbol que
      # difiere sólo en documentación.
      - name: Hash del árbol ensayado
        id: arbol
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "$SHA" > marca.txt
          echo "arbol=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - if: steps.arbol.outputs.arbol != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ensayo-verde-${{ steps.arbol.outputs.arbol }}
          path: marca.txt
          retention-days: 7
          overwrite: true

  # ── PRD: que esté sano y que las bases no se hayan desfasado ────────────────
  #
  # Producción de verdad (`claimmix-prd`) tiene clientes, así que acá no corre
  # nada que escriba: ni el ensayo, ni el pen test, ni el timbre, ni la carga.
  # Son el smoke —sin `--deep`— y una pregunta a `/api/health?deep=1`: que las
  # dependencias contesten y que `bases.desfase` no sea verdadero, o sea, que
  # las migraciones de las bases estén aplicadas todas igual.
  #
  # Mismo cinturón que los otros dos: la guarda mira el sufijo del nombre del
  # entorno, y los secretos son los suyos (`PRD_CRON_SECRET`), nunca los de dev.
  # Sin `vars.PRD_URL` el job corta en voz alta: un deploy de prd que nadie
  # comprueba no puede quedar en verde.
  prd:
    name: PRD · Smoke y salud de las bases
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, '-prd')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Smoke de prd
        # Contra el alias y esperando este commit, igual que el de dev.
        env:
          CRON_SECRET: ${{ secrets.PRD_CRON_SECRET }}
          PRD_URL: ${{ vars.PRD_URL }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -z "$PRD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltan vars.PRD_URL o secrets.PRD_CRON_SECRET: prd no se puede comprobar."
            exit 1
          fi
          node scripts/lib/hosts-vetados.mjs --conocido "$PRD_URL" ||
            { echo "::error::PRD_URL no es un https de ClaimMix."; exit 1; }
          pnpm smoke -- --url "$PRD_URL" --expect-commit "$SHA"

      - name: Las bases no están desfasadas
        env:
          CRON_SECRET: ${{ secrets.PRD_CRON_SECRET }}
          PRD_URL: ${{ vars.PRD_URL }}
        run: |
          salud="$(curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "${PRD_URL%/}/api/health?deep=1")"
          if [ "$(echo "$salud" | jq -r '.bases.desfase')" = "true" ]; then
            echo "::error::Las bases de prd no tienen las mismas migraciones (bases.desfase)."
            exit 1
          fi
