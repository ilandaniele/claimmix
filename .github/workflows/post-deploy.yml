# Comprobar el deploy que acaba de salir.
#
# Qué pregunta cada uno de los siete chequeos, y por qué, vive en
# deploy-checks.yml: es un workflow reusable, porque un segundo proyecto de
# Vercel para QA lo llama contra su propia URL y su propia base. Este archivo
# sólo decide CUÁNDO llamarlo, y contra cuál de los dos.

name: Post-deploy

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "URL a chequear"
        default: "https://claimmix.vercel.app"
        required: false

# Una corrida por vez, y sin cancelar la que está andando.
#
# Estos trabajos no corren contra un runner limpio: corren contra la base de
# PRODUCCIÓN, y algunos crean casos y los borran al terminar. Dos corridas
# superpuestas se pisan los casos entre sí, y el que pierde reporta que su
# caso no se creó — un rojo que no dice nada sobre el deploy.
#
# `cancel-in-progress: false` y no `true`: cortar una corrida a la mitad deja
# casos de prueba sin limpiar en la base de un cliente. Que espere.
#
# El grupo es una constante, no la rama ni el commit: lo que hay que serializar
# no son los deploys, es el acceso a esa base.
#
# ── Pero la cola es sólo de producción, y esto costó una corrida ─────────────
#
# `deployment_status` llega también por cada preview y por cada estado
# intermedio. Esas corridas saltean todo —el job `produccion` tiene la
# guarda— y terminan en `skipped`. Parecen gratis. No lo son: **ya reservaron
# el turno**.
#
# Con `cancel-in-progress: false` GitHub guarda UNA sola corrida esperando.
# Cuando llega otra, la que estaba en la cola se cancela. El 10/09, con una
# corrida andando, pasó esto:
#
#     16:26:25  886336c  Production  ← el merge a main, encolado
#     16:27:58  5dbf546  Preview     ← se crea el run de una rama
#     16:27:59  886336c  cancelled   ← un segundo después, sin un job arrancado
#
# El post-deploy del merge nunca corrió, y no dejó un rojo: dice `cancelled`,
# que se lee como que alguien la cortó a propósito. Una corrida que no ejecuta
# nada puede tapar la única comprobación que mira producción de verdad.
#
# Así que entra a la cola lo mismo que pasa la guarda de `produccion`. Todo lo
# demás va a un grupo propio —uno por corrida— donde no espera ni echa a
# nadie. La condición está repetida a propósito: son dos lugares distintos de
# GitHub y no hay forma de compartirla.
#
# La condición también distingue el proyecto, no sólo el entorno: el deploy
# del proyecto de QA llega etiquetado igual —`Production` es el nombre de SU
# entorno, en SU proyecto— y sin distinguirlo entraría a esta misma cola y
# podría cancelar una corrida de producción de verdad que estuviera encolada.
#
# ⛔ Acá decía `deployment.ref == 'main'`, y por eso la cola estuvo MUERTA.
# Vercel le pone el SHA a `deployment.ref`, así que esa comparación no era
# cierta nunca: todo deploy de producción caía en el grupo `sin-cola`, uno por
# corrida, y dos post-deploy podían correr a la vez contra la base de un
# cliente pisándose los casos de ensayo. #199 arregló la guarda del job de
# abajo y se olvidó de esta copia —que es justo lo que advierte el comentario
# de arriba: son dos lugares distintos y hay que tocar los dos—.
#
# ── El proyecto se distingue por el NOMBRE del entorno, no por la URL ───────
#
# Acá hubo tres condiciones sobre `environment_url` —exigir que empezara con
# `https://claimmix`, excluir `https://claimmix-qa-` y excluir
# `https://claimmix-qa.`— y las tres eran inútiles. El primer deploy real de
# QA mostró que ese campo NO lleva el nombre del proyecto:
#
#     Production – claimmix     https://claimmix-nbjnatqfk-ilandaniele-3471s-projects.vercel.app
#     Production – claimmix-qa  https://claimmix-jerqmlxd5-ilandaniele-3471s-projects.vercel.app
#     Preview – claimmix        https://claimmix-ax2tnp71i-ilandaniele-3471s-projects.vercel.app
#
# Vercel arma ese host con el nombre del proyecto y un hash, y para los dos
# proyectos el nombre es el mismo prefijo: `claimmix-`. Ninguna URL de QA
# empieza con `https://claimmix-qa`, así que las dos exclusiones no podían
# casar nunca. No es teoría: la corrida 35352800702 corrió el job `produccion`
# para el deploy `c83b750` —que es de QA— y su smoke falló contra el alias de
# producción, que ese deploy no tocó.
#
# Lo que sí distingue a los dos proyectos es el NOMBRE del entorno. Cuando hay
# más de un proyecto, GitHub le agrega el nombre del proyecto para
# desambiguarlo: `Production – claimmix` y `Production – claimmix-qa`, con
# guion largo (U+2013). De ahí `endsWith(…, '-qa')`, que es el sufijo del
# nombre del proyecto en Vercel.
#
# Sigue siendo `startsWith(…, 'Production')` y no `== 'Production'`: la
# igualdad exacta dejó de ser cierta el día que nació el segundo proyecto.
#
# Y sigue fallando CERRADA: si el nombre llegara vacío, `startsWith` es falso
# y no entra. Lo que se cae con un cambio de nombre del proyecto de QA es la
# exclusión, así que renombrarlo obliga a tocar estas dos copias de la
# condición — la de acá y la del `if` del job.
#
# ── Y QA tiene su propia cola, no la de producción ni la de nadie ──────────
#
# Desde que existe el job `qa`, un deploy de QA tampoco es gratis: corre el
# ensayo, que escribe y borra casos en la base de QA. Dos corridas de QA
# encimadas se pisan igual que dos de producción.
#
# Pero va a un grupo DISTINTO. Son dos bases distintas: hacer esperar a QA
# porque producción está midiendo no protege nada, y al revés tampoco — y con
# una sola cola compartida, el turno que QA reserva es el que le cancela la
# corrida encolada a producción, que es el defecto contado justo arriba.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.deployment_status.state == 'success' &&
    startsWith(github.event.deployment.environment, 'Production') &&
    !endsWith(github.event.deployment.environment, '-qa')))
    && 'post-deploy-contra-produccion'
    || (github.event.deployment_status.state == 'success' &&
    startsWith(github.event.deployment.environment, 'Production') &&
    endsWith(github.event.deployment.environment, '-qa'))
    && 'post-deploy-contra-qa'
    || format('post-deploy-sin-cola-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produccion:
    # El proyecto, no sólo el entorno: el deploy del proyecto de QA también
    # llega con un entorno que empieza con `Production` —así se llama SU
    # entorno de producción, en SU proyecto— y sin distinguirlo esto correría
    # el smoke de producción contra el alias de producción para un deploy que
    # nunca lo tocó. Pasó, y está contado arriba con el número de corrida, en
    # el comentario de `concurrency`: ahí también está por qué la distinción
    # es el NOMBRE del entorno y no `environment_url`. Es la misma condición
    # que el grupo de `concurrency`, un piso más arriba, y las dos se tocan
    # juntas.
    #
    # ⛔ `deployment.ref` NO es el nombre de la rama: Vercel le pone el SHA.
    #
    # Se probó y el post-deploy quedó MUERTO — `f73a28b` desplegó a producción
    # con `state: success` y la corrida salió salteada, que es exactamente el
    # defecto que este trabajo vino a sacar: verde porque no corrió.
    #
    # Contra QA corre el job `qa`, acá abajo, con sus propios secretos y sus
    # propios interruptores. Lo que QA no puede correr queda nombrado en el
    # resumen del run por el job `alcance` de deploy-checks.yml.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production') &&
       !endsWith(github.event.deployment.environment, '-qa'))
    permissions:
      contents: read
      # Techo para el job `rehearse` de deploy-checks.yml: un workflow
      # reusable nunca obtiene más permiso que el de quien lo llama, así que
      # sin id-token acá ese job no podría pedir el token OIDC para WIF.
      id-token: write
    uses: ./.github/workflows/deploy-checks.yml
    with:
      # El `url` del disparo a mano llega hasta acá: si no, sería un campo
      # que se puede llenar y no hace nada.
      url: ${{ github.event.inputs.url || 'https://claimmix.vercel.app' }}
      entorno: Production
      medir_carga: true
    secrets: inherit
  # ── QA: primero, que los secretos de QA sean de QA ──────────────────────────
  #
  # Seis de los siete chequeos corren acá, en el runner, y hablan con la base
  # por `DATABASE_URL`. Tres de ellos ESCRIBEN. Por eso el job `qa` de abajo
  # mapea los secretos uno por uno en vez de heredarlos: heredando, una corrida
  # de QA crearía y borraría casos en la base de un cliente.
  #
  # Este job es el cinturón de ese mapeo, y hace dos cosas.
  #
  # Primero exige los tres secretos sin los cuales QA no puede correr NADA, y
  # falla en voz alta si falta alguno. La alternativa —que el caller mande el
  # secreto vacío y el job de abajo se rompa con el mensaje del script— también
  # sale roja, pero roja donde no se entiende: "falta DATABASE_URL" en un job
  # que sí la recibió, vacía.
  #
  # Y segundo, compara la cadena de QA con la de producción sin imprimir
  # ninguna de las dos. Si son la misma, alguien cargó la de producción en el
  # secreto de QA, y la próxima corrida de QA escribe en la base de un cliente.
  # Es el único error de esta familia que no se ve en ningún lado hasta que ya
  # pasó.
  #
  # Lo que NO es obligatorio se mira igual, y su ausencia apaga un chequeo en
  # vez de romper la corrida: el ensayo sube adjuntos de verdad y necesita
  # almacenamiento propio y un inquilino propio. Sin eso no corre, y el job
  # `alcance` de deploy-checks.yml lo nombra como no verificado.
  qa_secretos:
    name: QA tiene lo suyo
    runs-on: ubuntu-latest
    # Misma condición que el grupo de `concurrency`, con el sufijo al revés.
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, '-qa')
    outputs:
      ensayo: ${{ steps.mirar.outputs.ensayo }}
    steps:
      - name: Que estén, y que no sean los de producción
        id: mirar
        env:
          BASE: ${{ secrets.QA_DATABASE_URL }}
          BASE_APP: ${{ secrets.QA_DATABASE_URL_APP }}
          CRON: ${{ secrets.QA_CRON_SECRET }}
          BASE_PROD: ${{ secrets.DATABASE_URL }}
          BASE_APP_PROD: ${{ secrets.DATABASE_URL_APP }}
          INQUILINO: ${{ secrets.QA_GMAIL_TENANT_ID }}
          AUTH: ${{ secrets.QA_BETTER_AUTH_SECRET }}
          R2_CUENTA: ${{ secrets.QA_R2_ACCOUNT_ID }}
          R2_LLAVE: ${{ secrets.QA_R2_ACCESS_KEY_ID }}
          R2_SECRETO: ${{ secrets.QA_R2_SECRET_ACCESS_KEY }}
          R2_BALDE: ${{ secrets.QA_R2_BUCKET }}
          R2_BALDE_PROD: ${{ secrets.R2_BUCKET }}
          R2_LLAVE_PROD: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          faltan=""
          [ -n "$BASE" ] || faltan="$faltan QA_DATABASE_URL"
          [ -n "$BASE_APP" ] || faltan="$faltan QA_DATABASE_URL_APP"
          [ -n "$CRON" ] || faltan="$faltan QA_CRON_SECRET"
          if [ -n "$faltan" ]; then
            {
              echo "### Contra QA no corrió ningún chequeo"
              echo ""
              echo "Faltan secretos del repositorio:$faltan"
              echo ""
              echo "Cargá cada uno en Settings, Secrets and variables, Actions."
              echo "Los dos primeros son la rama de Neon de QA, NO la base de"
              echo "producción: el ensayo escribe y borra casos ahí adentro."
              echo "El tercero es el CRON_SECRET del proyecto claimmix-qa."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=QA sin secretos::Faltan$faltan - ver el resumen del run."
            exit 1
          fi
          # Sin imprimir ninguna de las dos.
          if [ "$BASE" = "$BASE_PROD" ] || [ "$BASE_APP" = "$BASE_APP_PROD" ]; then
            {
              echo "### QA apunta a la base de PRODUCCIÓN"
              echo ""
              echo "QA_DATABASE_URL (o QA_DATABASE_URL_APP) tiene la misma cadena"
              echo "que el secreto de producción. Si esto corriera, el ensayo"
              echo "escribiría y borraría casos en la base de un cliente."
              echo ""
              echo "Corregilo antes de volver a desplegar QA."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=QA apunta a producción::Los secretos de QA son los de producción."
            exit 1
          fi
          # Lo mismo para el almacenamiento: con el balde o la llave de
          # producción, el ensayo sube y borra adjuntos de un cliente. La
          # cuenta sí es la misma a propósito, así que no se compara.
          if { [ -n "$R2_BALDE_PROD" ] && [ "$R2_BALDE" = "$R2_BALDE_PROD" ]; } ||
             { [ -n "$R2_LLAVE_PROD" ] && [ "$R2_LLAVE" = "$R2_LLAVE_PROD" ]; }; then
            {
              echo "### QA apunta al balde de PRODUCCIÓN"
              echo ""
              echo "QA_R2_BUCKET (o QA_R2_ACCESS_KEY_ID) es el de producción."
              echo "Si esto corriera, el ensayo subiría y borraría adjuntos"
              echo "en el balde de un cliente."
              echo ""
              echo "QA tiene el suyo: claimmix-qa-attachments, con su token."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=QA apunta al balde de producción::Los secretos de R2 de QA son los de producción."
            exit 1
          fi
          # El ensayo sube adjuntos de verdad, y desde el 20/09 QA tiene balde
          # propio para eso: claimmix-qa-attachments, con su propio token. Sin
          # los cuatro QA_R2_* no hay dónde subirlos y el ensayo no corre.
          if [ -n "$INQUILINO" ] && [ -n "$AUTH" ] && [ -n "$R2_CUENTA" ] &&
             [ -n "$R2_LLAVE" ] && [ -n "$R2_SECRETO" ] && [ -n "$R2_BALDE" ]; then
            echo "ensayo=1" >> "$GITHUB_OUTPUT"
          else
            echo "ensayo=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=QA sin ensayo::Faltan QA_GMAIL_TENANT_ID, QA_BETTER_AUTH_SECRET o los QA_R2_* - el ensayo no corre."
          fi

  # ── QA: lo que sí puede correr ──────────────────────────────────────────────
  #
  # Corre el smoke, las dos comparaciones contra el catálogo y —cuando QA tiene
  # lo suyo— el ensayo. No corre el timbre (QA no lleva Gmail ni WhatsApp: no le
  # escribe a nadie, a propósito), ni el pen test (le falta el inquilino de
  # demo), ni la carga (cuatrocientos casos contra los cientos de miles de
  # producción no comparan con el mismo presupuesto).
  #
  # El smoke va liviano: `--deep` sube un archivo a R2 y llama al modelo, y eso
  # no es lo que este run viene a probar. Hasta el 20/09 además toleraba
  # `almacenamiento`, porque el proyecto de QA no tenía R2 y el chequeo salía
  # rojo SIEMPRE por lo mismo. Ahora QA tiene balde propio
  # (`claimmix-qa-attachments`, misma cuenta de Cloudflare que producción pero
  # con un token que no alcanza al balde de los clientes, ni el de producción
  # al de QA), así que el chequeo liviano —que sólo mira que las cuatro
  # variables llegaron al deploy— contesta ok sin tolerar nada. Liviano igual
  # quiere decir que la subida no se ejerció.
  #
  # `whatsapp` y `gmail` no hace falta tolerarlos: sin configurar avisan, no
  # fallan.
  #
  # Nada de esto queda implícito: el job `alcance` escribe, al final del run,
  # una fila por chequeo con lo que pasó o el motivo por el que no corrió.
  qa:
    needs: [qa_secretos]
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      endsWith(github.event.deployment.environment, '-qa')
    permissions:
      contents: read
      # Techo para el ensayo, que pide el token OIDC de WIF. Sin ensayo no se
      # usa, y un permiso que sobra no hace nada.
      id-token: write
    uses: ./.github/workflows/deploy-checks.yml
    with:
      url: https://claimmix-qa.vercel.app
      entorno: QA
      smoke_profundo: false
      correr_ensayo: ${{ needs.qa_secretos.outputs.ensayo == '1' }}
      correr_timbre: false
      correr_pentest: false
      medir_carga: false
    # Uno por uno y con el nombre de QA de cada lado. `secrets: inherit` acá
    # sería apuntar seis jobs a la base de producción; está contado arriba, en
    # `qa_secretos`, y también en deploy-checks.yml donde se declaran.
    secrets:
      CRON_SECRET: ${{ secrets.QA_CRON_SECRET }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      DATABASE_URL_APP: ${{ secrets.QA_DATABASE_URL_APP }}
      GMAIL_TENANT_ID: ${{ secrets.QA_GMAIL_TENANT_ID }}
      BETTER_AUTH_SECRET: ${{ secrets.QA_BETTER_AUTH_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.QA_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.QA_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.QA_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.QA_R2_BUCKET }}
      # El modelo no tiene versión de QA y no hace falta: el ensayo corre acá,
      # en el runner, y llama a Vertex con el mismo proyecto de GCP. Lo que
      # nunca se comparte es la base.
      GEMINI_TRANSPORT: ${{ secrets.GEMINI_TRANSPORT }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
      VERTEX_EXTRACTION_MODEL: ${{ secrets.VERTEX_EXTRACTION_MODEL }}
