# Que no entre nada que no deba estar acá.
#
# El repositorio es público. Un secreto commiteado a un repo público lo cosechan
# bots en minutos — no es una hipótesis, es una industria — y borrarlo después
# no sirve: queda en el historial, en los forks y en los cachés. Lo único que
# funciona es que no entre.
#
# GitHub ya tiene su propio escaneo con protección de push, activado. Esto corre
# igual por dos motivos: reconoce patrones que GitHub no (los nuestros, y datos
# personales que no son credenciales pero tampoco van en un repo público), y no
# depende de que una función siga estando disponible en el plan.
#
# El escaneo profundo del historial completo corre semanalmente. En cada push
# se mira lo que trae ese push, que es donde todavía se puede frenar.
#
# El clon tiene que ser completo igual, aunque sólo se mire el push. gitleaks
# arma el rango del evento (`<antes>^..<después>`) y se lo pasa a git; con un
# clon de profundidad 1 esos commits no están, git contesta 'unknown revision'
# y el escaneo termina con «0 commits scanned» y código 1. O sea lo peor de las
# dos: el trabajo en rojo, y ni un commit revisado. Así estuvo desde que se
# agregó, el 21 de agosto: las corridas del domingo —que sí clonan todo—
# pasaban, y las de cada push fallaban sin mirar nada.

name: Secretos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Domingos a las 4 de la mañana: el historial entero, por si algo entró
    # antes de que esto existiera.
    - cron: "0 4 * * 0"
  workflow_dispatch:

# Una corrida por rama; la anterior se cancela. Sólo lee el repositorio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Buscar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Completo siempre. gitleaks necesita los commits del rango que va a
          # revisar, y con profundidad 1 no están: no revisa nada y falla. Este
          # repositorio son segundos de clon; el ahorro no existía y el costo
          # era no tener escaneo.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  personal-data:
    name: Datos personales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Números y direcciones reales en el código
        # La lógica vive en el script para poder correrla antes de commitear:
        #   bash scripts/check-personal-data.sh
        #
        # Un chequeo que sólo existe en un YAML sólo se descubre roto cuando
        # ya rompió el build de otro.
        run: bash scripts/check-personal-data.sh

  # ── Invariantes de arquitectura ────────────────────────────────────────────
  #
  # `node scripts/check-architecture.mjs` comprueba, entre otras, que ninguna
  # consulta se salga de la capa de datos. Esa capa es lo que pone el contexto
  # de inquilino, y sin contexto RLS no filtra: una consulta que la esquiva ve
  # las denuncias de todos los aseguradores. Es el peor escenario del producto.
  #
  # Vivía sólo dentro de `pnpm verify` y `pnpm listo`, o sea que se ejecutaba
  # cuando alguien se acordaba de correrlos en su máquina. La CI corre los
  # pedazos por separado —tipos, lint, unitarios— y ninguno la incluía, así que
  # en un pull request no se ejecutaba nunca. Una guarda que depende de la
  # memoria de quien la escribió no es una guarda.
  #
  # Va acá y no en ci.yml porque no necesita dependencias: el script sólo usa
  # módulos nativos de node, así que corre en segundos sin instalar nada.
  arquitectura:
    name: Las invariantes se sostienen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Ninguna consulta se sale de la capa de datos
        # La lógica vive en el script para poder correrla antes de commitear:
        #   pnpm arquitectura
        run: node scripts/check-architecture.mjs
